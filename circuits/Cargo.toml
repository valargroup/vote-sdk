[package]
name = "shielded-vote-circuits"
version = "0.1.0"
edition = "2021"
description = "Halo2 ZKP circuits and FFI verification for the Shielded-Vote chain"

[lib]
crate-type = ["staticlib", "lib"]

[features]
default = ["zakura"]
upstream = [
    "voting-crypto-deps/upstream-validator",
    "voting-circuits/upstream",
    "imt-tree/upstream",
    "vote-commitment-tree/upstream",
]
zakura = [
    "voting-crypto-deps/zakura-validator",
    "voting-circuits/zakura",
    "imt-tree/zakura",
    "vote-commitment-tree/zakura",
]

[dependencies]
voting-crypto-deps = { version = "=0.1.2", default-features = false }
vote-commitment-tree = { version = "=0.5.2", default-features = false }
voting-circuits = { version = "=0.10.3", default-features = false }
imt-tree = { version = "=0.4.0", default-features = false }
incrementalmerkletree = "0.8"
nonempty = "0.11"
zcash_protocol = "0.10"
hex = "0.4"

[dev-dependencies]
blake2b_simd = "1"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace]
