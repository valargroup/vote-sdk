# Reset the full SDK chain fleet from genesis: quiesce the snapshot publisher,
# wipe state, re-init primary with deterministic keys, upload genesis to DO
# Spaces, reset the snapshot node, fund the secondary from a vote manager, then
# join secondary and archive.
# Manual-only: triggered via workflow_dispatch with a release tag.

name: Reset SDK Chain

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to deploy (e.g. v1.2.3). Must already exist in DO Spaces."
        type: string
        required: true
      network_config_json:
        description: "Optional JSON overrides for domain, chain_id, hosts, URLs, bucket, and extra validators."
        type: string
        required: false
        default: "{}"

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag }}
  DOMAIN: ${{ fromJSON(inputs.network_config_json || '{}').domain || secrets.DOMAIN }}
  CHAIN_ID: ${{ fromJSON(inputs.network_config_json || '{}').chain_id || 'svote-1' }}
  SPACES_BUCKET: ${{ fromJSON(inputs.network_config_json || '{}').spaces_bucket || 'vote' }}
  SPACES_REGION: ${{ fromJSON(inputs.network_config_json || '{}').spaces_region || 'fra1' }}
  GENESIS_OBJECT_KEY: ${{ fromJSON(inputs.network_config_json || '{}').genesis_object_key || 'genesis.json' }}
  CLEAR_SNAPSHOT_ARTIFACTS: ${{ fromJSON(inputs.network_config_json || '{}').clear_snapshot_artifacts == false && 'false' || 'true' }}
  FULL_STACK: ${{ fromJSON(inputs.network_config_json || '{}').full_stack == false && 'false' || 'true' }}
  DO_SPACES_BASE: https://${{ fromJSON(inputs.network_config_json || '{}').spaces_bucket || 'vote' }}.${{ fromJSON(inputs.network_config_json || '{}').spaces_region || 'fra1' }}.digitaloceanspaces.com
  GENESIS_URL: https://${{ fromJSON(inputs.network_config_json || '{}').spaces_bucket || 'vote' }}.${{ fromJSON(inputs.network_config_json || '{}').spaces_region || 'fra1' }}.digitaloceanspaces.com/${{ fromJSON(inputs.network_config_json || '{}').genesis_object_key || 'genesis.json' }}
  RELEASE_BASE_URL: https://vote.fra1.digitaloceanspaces.com/binaries/vote-sdk
  PRIMARY_HOST: ${{ fromJSON(inputs.network_config_json || '{}').primary_host || secrets.PRIMARY_HOST }}
  SECONDARY_HOST: ${{ fromJSON(inputs.network_config_json || '{}').secondary_host || secrets.SECONDARY_HOST }}
  SNAPSHOT_HOST: ${{ fromJSON(inputs.network_config_json || '{}').snapshot_host || format('snapshots.{0}', fromJSON(inputs.network_config_json || '{}').domain || secrets.DOMAIN) }}
  EXPLORER_HOST: ${{ fromJSON(inputs.network_config_json || '{}').explorer_host || format('explorer.{0}', fromJSON(inputs.network_config_json || '{}').domain || secrets.DOMAIN) }}
  PRIMARY_API_URL: ${{ fromJSON(inputs.network_config_json || '{}').primary_api_url || format('https://vote-chain-primary.{0}', fromJSON(inputs.network_config_json || '{}').domain || secrets.DOMAIN) }}
  SECONDARY_API_URL: ${{ fromJSON(inputs.network_config_json || '{}').secondary_api_url || format('https://vote-chain-secondary.{0}', fromJSON(inputs.network_config_json || '{}').domain || secrets.DOMAIN) }}
  SNAPSHOT_URL: ${{ fromJSON(inputs.network_config_json || '{}').snapshot_url || format('https://snapshots.{0}', fromJSON(inputs.network_config_json || '{}').domain || secrets.DOMAIN) }}
  EXPLORER_API_URL: ${{ fromJSON(inputs.network_config_json || '{}').explorer_api_url || format('https://explorer-api.{0}', fromJSON(inputs.network_config_json || '{}').domain || secrets.DOMAIN) }}
  EXTRA_VALIDATOR_HOSTS: ${{ fromJSON(inputs.network_config_json || '{}').extra_validator_hosts || '' }}
  EXTRA_VALIDATOR_API_URLS: ${{ fromJSON(inputs.network_config_json || '{}').extra_validator_api_urls || '' }}

jobs:
  validate-tag:
    name: Validate release tag exists in DO Spaces
    runs-on: ubuntu-latest
    steps:
      - name: HEAD-check published tarballs
        run: |
          set -euo pipefail
          MISSING=0
          for PLATFORM in linux-amd64 linux-arm64; do
            URL="${RELEASE_BASE_URL}/shielded-vote-${TAG}-${PLATFORM}.tar.gz"
            STATUS=$(curl -sI -o /dev/null -w "%{http_code}" "$URL")
            if [ "$STATUS" = "200" ]; then
              echo "[OK]  ${PLATFORM} -> $URL"
            else
              echo "[MISSING] ${PLATFORM} (HTTP ${STATUS}) -> $URL"
              MISSING=1
            fi
          done
          if [ "$MISSING" -ne 0 ]; then
            echo ""
            echo "ERROR: tag '${TAG}' is not published. Refusing to proceed (would wipe chain state and then fail)."
            echo "  Confirm the tag was successfully built by release.yml and uploaded to s3://vote/binaries/vote-sdk/."
            exit 1
          fi

  quiesce-snapshot:
    name: Quiesce snapshot publisher
    runs-on: ubuntu-latest
    needs: validate-tag
    steps:
      - name: Skip snapshot quiesce for lean reset
        if: ${{ env.FULL_STACK != 'true' }}
        run: echo "full_stack=false; no snapshot node to quiesce."

      - name: Stop snapshot timer before chain reset
        if: ${{ env.FULL_STACK == 'true' }}
        uses: appleboy/ssh-action@v1.0.3
        timeout-minutes: 5
        with:
          host: ${{ env.SNAPSHOT_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: SNAPSHOT_HOST,SNAPSHOT_URL
          script: |
            set -euo pipefail

            # Stop publisher first so old chain state cannot republish stale
            # metadata after upload-genesis clears public snapshot artifacts.
            systemctl stop snapshot.timer
            systemctl disable snapshot.timer
            systemctl stop snapshot.service
            systemctl stop svoted
            systemctl reset-failed snapshot.timer snapshot.service svoted || true
            echo "Snapshot publisher quiesced."

  quiesce-archive:
    name: Quiesce archive publisher
    runs-on: ubuntu-latest
    needs: validate-tag
    steps:
      - name: Skip archive quiesce for lean reset
        if: ${{ env.FULL_STACK != 'true' }}
        run: echo "full_stack=false; no archive node to quiesce."

      - name: Stop archive snapshot timer before chain reset
        if: ${{ env.FULL_STACK == 'true' }}
        uses: appleboy/ssh-action@v1.0.3
        timeout-minutes: 5
        with:
          host: ${{ env.EXPLORER_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail

            # Stop archive publishing before upload-genesis clears public
            # snapshot artifacts, so old archive state cannot republish after
            # the bucket prefix is wiped.
            systemctl stop archive-snapshot.timer || true
            systemctl disable archive-snapshot.timer || true
            systemctl stop archive-snapshot.service || true
            systemctl stop svoted || true
            systemctl reset-failed archive-snapshot.timer archive-snapshot.service svoted || true
            echo "Archive publisher quiesced."

  reset-primary:
    name: Reset primary (bootstrap)
    runs-on: ubuntu-latest
    needs: [quiesce-snapshot, quiesce-archive]
    steps:
      - name: Install tag and reset primary
        uses: appleboy/ssh-action@v1.0.3
        timeout-minutes: 15
        with:
          host: ${{ env.PRIMARY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: TAG,SENTRY_DSN
          script: |
            set -euo pipefail
            export PATH="/opt/shielded-vote/current/bin:$PATH"

            # Install the release
            /opt/shielded-vote/install-release.sh --tag "${TAG}" --skip-restart

            # Stop svoted
            systemctl stop svoted || true

            # Wipe chain state (preserve the releases dir)
            rm -rf /opt/shielded-vote/.svoted/*

            # Write Sentry DSN into the systemd EnvironmentFile
            sed -i '/^SENTRY_DSN=/d' /etc/default/svoted
            echo "SENTRY_DSN=$SENTRY_DSN" >> /etc/default/svoted

            # Run init.sh with deterministic validator key and vote-manager set.
            export SVOTED_HOME=/opt/shielded-vote/.svoted
            export CHAIN_ID="${{ env.CHAIN_ID }}"
            export VM_PRIVKEYS="${{ fromJSON(inputs.network_config_json || '{}').spaces_bucket == 'vote-loadtest' && secrets.LOADTEST_VM_PRIVKEYS || secrets.VM_PRIVKEYS }}"
            export VAL_PRIVKEY="${{ secrets.PRIMARY_VAL_PRIVKEY }}"
            export SVOTE_ADMIN_DISABLE=false
            if [ -f /etc/default/svoted ]; then
              set -a
              . /etc/default/svoted
              set +a
              export CHAIN_ID="${{ env.CHAIN_ID }}"
              export VM_PRIVKEYS="${{ fromJSON(inputs.network_config_json || '{}').spaces_bucket == 'vote-loadtest' && secrets.LOADTEST_VM_PRIVKEYS || secrets.VM_PRIVKEYS }}"
              export VAL_PRIVKEY="${{ secrets.PRIMARY_VAL_PRIVKEY }}"
              export SVOTE_ADMIN_DISABLE=false
            fi
            curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/scripts/init.sh" -o /tmp/init.sh
            curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/scripts/_vote_manager_keys_lib.sh" -o /tmp/_vote_manager_keys_lib.sh
            bash /tmp/init.sh

            # Ensure the primary systemd drop-in exists (serves admin UI)
            mkdir -p /etc/systemd/system/svoted.service.d
            printf '[Service]\nExecStart=\nExecStart=/opt/shielded-vote/current/bin/svoted start --home /opt/shielded-vote/.svoted --serve-ui --ui-dist /opt/shielded-vote/current/ui/dist\n' \
              > /etc/systemd/system/svoted.service.d/primary.conf

            # Start svoted
            systemctl daemon-reload
            systemctl start svoted

            # Wait for REST API
            for i in $(seq 1 30); do
              if curl -sf http://localhost:1317/shielded-vote/v1/rounds > /dev/null 2>&1; then
                echo "Primary REST API healthy."
                exit 0
              fi
              echo "Waiting for primary REST API... ($i/30)"
              sleep 10
            done
            echo "ERROR: Primary REST API not healthy after 5 minutes."
            exit 1
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

  upload-genesis:
    name: Upload genesis to DO Spaces
    runs-on: ubuntu-latest
    needs: reset-primary
    steps:
      - name: Fetch genesis and upload to DO Spaces
        uses: appleboy/ssh-action@v1.0.3
        timeout-minutes: 5
        with:
          host: ${{ env.PRIMARY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DO_ACCESS_KEY,DO_SECRET_KEY,SPACES_BUCKET,SPACES_REGION,GENESIS_OBJECT_KEY,CHAIN_ID,CLEAR_SNAPSHOT_ARTIFACTS
          script: |
            set -euo pipefail

            # Fetch genesis from local REST API
            curl -fsSL http://localhost:1317/shielded-vote/v1/genesis > /tmp/genesis.json
            echo "Genesis fetched ($(wc -c < /tmp/genesis.json) bytes)."

            # Install s3cmd if not present
            which s3cmd > /dev/null 2>&1 || apt-get install -y -qq s3cmd

            # Upload directly to DO Spaces
            cat > /tmp/do-spaces.s3cfg <<EOCFG
            [default]
            access_key = ${DO_ACCESS_KEY}
            secret_key = ${DO_SECRET_KEY}
            host_base = ${SPACES_REGION}.digitaloceanspaces.com
            host_bucket = %(bucket)s.${SPACES_REGION}.digitaloceanspaces.com
            bucket_location = ${SPACES_REGION}
            use_https = True
            EOCFG
            s3cmd -c /tmp/do-spaces.s3cfg put /tmp/genesis.json "s3://${SPACES_BUCKET}/${GENESIS_OBJECT_KEY}" --acl-public --force
            if [ "${CLEAR_SNAPSHOT_ARTIFACTS}" = "true" ]; then
              echo "Clearing old snapshot artifacts from s3://${SPACES_BUCKET}/snapshots/${CHAIN_ID}/..."
              s3cmd -c /tmp/do-spaces.s3cfg del --recursive "s3://${SPACES_BUCKET}/snapshots/${CHAIN_ID}/"
            fi
            rm -f /tmp/do-spaces.s3cfg
            echo "Genesis uploaded to s3://${SPACES_BUCKET}/${GENESIS_OBJECT_KEY}"
        env:
          DO_ACCESS_KEY: ${{ fromJSON(inputs.network_config_json || '{}').spaces_bucket == 'vote-loadtest' && secrets.LOADTEST_DO_ACCESS_KEY || secrets.DO_ACCESS_KEY }}
          DO_SECRET_KEY: ${{ fromJSON(inputs.network_config_json || '{}').spaces_bucket == 'vote-loadtest' && secrets.LOADTEST_DO_SECRET_KEY || secrets.DO_SECRET_KEY }}

  fund-secondary:
    name: Fund secondary validator
    runs-on: ubuntu-latest
    needs: upload-genesis
    steps:
      - name: Send tokens from vote-manager to secondary address
        uses: appleboy/ssh-action@v1.0.3
        timeout-minutes: 5
        with:
          host: ${{ env.PRIMARY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: CHAIN_ID
          script: |
            set -euo pipefail
            export PATH="/opt/shielded-vote/current/bin:$PATH"
            HOME_DIR=/opt/shielded-vote/.svoted

            # Derive the secondary address from its private key without importing
            # it into the primary's keyring: import into a temp keyring, read
            # address, delete.
            TMPKR=$(mktemp -d)
            svoted keys import-hex secondary-tmp "${{ secrets.SECONDARY_VAL_PRIVKEY }}" \
              --keyring-backend test --home "$TMPKR"
            SECONDARY_ADDR=$(svoted keys show secondary-tmp -a --keyring-backend test --home "$TMPKR")
            rm -rf "$TMPKR"

            echo "Funding secondary address: ${SECONDARY_ADDR}"

            svoted tx vote authorized-send "${SECONDARY_ADDR}" 100000000 usvote \
              --from vote-manager-1 \
              --keyring-backend test \
              --home "$HOME_DIR" \
              --chain-id "${CHAIN_ID}" \
              --yes

            echo "Waiting for tx to be included..."
            sleep 6

            BALANCE=$(svoted query bank balances "${SECONDARY_ADDR}" --home "$HOME_DIR" --output json \
              | jq -r '.balances[] | select(.denom == "usvote") | .amount')
            echo "Secondary balance: ${BALANCE} usvote"

  reset-extra-validators:
    name: Fund and reset extra validators
    runs-on: ubuntu-latest
    needs: fund-secondary
    env:
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      EXTRA_VAL_PRIVKEYS: ${{ secrets.EXTRA_VAL_PRIVKEYS }}
    steps:
      - name: Join val3+ validators
        run: |
          set -euo pipefail
          if [ -z "${EXTRA_VALIDATOR_HOSTS}" ]; then
            echo "No extra validators requested."
            exit 0
          fi
          if [ -z "${EXTRA_VAL_PRIVKEYS}" ]; then
            echo "ERROR: extra_validator_hosts was set, but EXTRA_VAL_PRIVKEYS secret is empty."
            exit 1
          fi

          IFS=',' read -r -a HOSTS <<< "${EXTRA_VALIDATOR_HOSTS}"
          IFS=',' read -r -a KEYS <<< "${EXTRA_VAL_PRIVKEYS}"
          if [ "${#HOSTS[@]}" -ne "${#KEYS[@]}" ]; then
            echo "ERROR: extra_validator_hosts count (${#HOSTS[@]}) != EXTRA_VAL_PRIVKEYS count (${#KEYS[@]})."
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          SSH=(ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=10 -o ServerAliveCountMax=6)

          for idx in "${!HOSTS[@]}"; do
            host="$(echo "${HOSTS[$idx]}" | xargs)"
            key="$(echo "${KEYS[$idx]}" | xargs)"
            moniker="valarg-val$((idx + 3))"
            if [ -z "${host}" ] || [ -z "${key}" ]; then
              echo "ERROR: empty host or key at extra validator index ${idx}."
              exit 1
            fi

            echo "Funding ${moniker} account from primary..."
            "${SSH[@]}" "${DEPLOY_USER}@${PRIMARY_HOST}" \
              "CHAIN_ID='${CHAIN_ID}' VAL_PRIVKEY='${key}' bash -se" <<'REMOTE_FUND'
              set -euo pipefail
              export PATH="/opt/shielded-vote/current/bin:$PATH"
              HOME_DIR=/opt/shielded-vote/.svoted
              TMPKR=$(mktemp -d)
              trap 'rm -rf "$TMPKR"' EXIT
              svoted keys import-hex extra-validator-tmp "${VAL_PRIVKEY}" \
                --keyring-backend test --home "$TMPKR" >/dev/null
              ADDR=$(svoted keys show extra-validator-tmp -a --keyring-backend test --home "$TMPKR")
              svoted tx vote authorized-send "${ADDR}" 100000000 usvote \
                --from vote-manager-1 \
                --keyring-backend test \
                --home "$HOME_DIR" \
                --chain-id "${CHAIN_ID}" \
                --yes
              echo "Funded ${ADDR}."
          REMOTE_FUND

            echo "Resetting ${moniker} on ${host}..."
            "${SSH[@]}" "${DEPLOY_USER}@${host}" \
              "TAG='${TAG}' GENESIS_URL='${GENESIS_URL}' PRIMARY_REST_URL='${PRIMARY_API_URL}' CHAIN_ID='${CHAIN_ID}' VAL_PRIVKEY='${key}' MONIKER='${moniker}' GITHUB_REPOSITORY='${{ github.repository }}' GITHUB_SHA='${{ github.sha }}' bash -se" <<'REMOTE_RESET'
              set -euo pipefail
              export PATH="/opt/shielded-vote/current/bin:$PATH"
              /opt/shielded-vote/install-release.sh --tag "${TAG}" --skip-restart
              export HOME_DIR=/opt/shielded-vote/.svoted
              if [ -f /etc/default/svoted ]; then
                set -a
                . /etc/default/svoted
                set +a
                export GENESIS_URL="${GENESIS_URL}"
                export PRIMARY_REST_URL="${SVOTE_PRIMARY_REST_URL:-${PRIMARY_REST_URL}}"
                export CHAIN_ID="${CHAIN_ID}"
                export VAL_PRIVKEY="${VAL_PRIVKEY}"
                export HOME_DIR=/opt/shielded-vote/.svoted
                export MONIKER="${MONIKER}"
              fi
              curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/scripts/reset-join.sh" -o /tmp/reset-join.sh
              bash /tmp/reset-join.sh
          REMOTE_RESET
          done

  reset-snapshot:
    name: Reset snapshot node
    runs-on: ubuntu-latest
    needs: upload-genesis
    steps:
      - name: Skip snapshot reset for lean reset
        if: ${{ env.FULL_STACK != 'true' }}
        run: echo "full_stack=false; no snapshot node to reset."

      - name: Install tag and join as snapshot node
        if: ${{ env.FULL_STACK == 'true' }}
        uses: appleboy/ssh-action@v1.0.3
        timeout-minutes: 30
        with:
          host: ${{ env.SNAPSHOT_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: TAG,GENESIS_URL,PRIMARY_API_URL,CHAIN_ID
          script: |
            set -euo pipefail
            export PATH="/opt/shielded-vote/current/bin:$PATH"

            # Install the release (skip restart — reset-snapshot.sh starts svoted).
            /opt/shielded-vote/install-release.sh --tag "${TAG}" --skip-restart

            # Run reset-snapshot: wipe state, download genesis, configure peering
            # with primary, start svoted as a pruned non-validator, and enable
            # the snapshot timer.
            export GENESIS_URL="${GENESIS_URL}"
            export PRIMARY_REST_URL="${SVOTE_PRIMARY_REST_URL:-${PRIMARY_API_URL}}"
            export HOME_DIR=/opt/shielded-vote/.svoted
            export CHAIN_ID="${CHAIN_ID}"
            export MONIKER=snapshot

            curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/scripts/reset-snapshot.sh" -o /tmp/reset-snapshot.sh
            bash /tmp/reset-snapshot.sh

      - name: Publish initial pruned snapshot
        if: ${{ env.FULL_STACK == 'true' }}
        uses: appleboy/ssh-action@v1.0.3
        timeout-minutes: 30
        with:
          host: ${{ env.SNAPSHOT_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: SNAPSHOT_HOST,SNAPSHOT_URL
          script: |
            set -euo pipefail

            PUBLIC_SNAPSHOT_HOST="${SNAPSHOT_HOST}"
            PUBLIC_SNAPSHOT_URL="${SNAPSHOT_URL}"
            set -a
            . /etc/default/snapshot
            set +a
            export SNAPSHOT_HOST="${PUBLIC_SNAPSHOT_HOST}"
            export SNAPSHOT_URL="${PUBLIC_SNAPSHOT_URL}"

            systemctl stop snapshot.timer || true
            for i in $(seq 1 20); do
              if /opt/shielded-vote/snapshot-publish.sh; then
                systemctl enable --now snapshot.timer
                echo "Initial pruned snapshot published."
                break
              fi
              if [ "$i" = "20" ]; then
                echo "ERROR: Initial pruned snapshot publish failed after retries."
                systemctl enable --now snapshot.timer || true
                exit 1
              fi
              echo "Snapshot node is not ready to publish yet; retrying... ($i/20)"
              systemctl reset-failed snapshot.service || true
              sleep 30
            done

            SNAPSHOT_HOSTNAME="${SNAPSHOT_HOST}"
            for path in /daily.json /latest.json /snapshots.json; do
              curl -fsS --resolve "${SNAPSHOT_HOSTNAME}:443:127.0.0.1" \
                "${SNAPSHOT_URL}${path}" \
                | jq -e 'type == "object" or type == "array"' > /dev/null
              echo "[OK] ${path}"
            done
            curl -fsS --resolve "${SNAPSHOT_HOSTNAME}:443:127.0.0.1" \
              "${SNAPSHOT_URL}/daily.json" \
              | jq -e '.roles | index("daily") != null' > /dev/null
            curl -fsS --resolve "${SNAPSHOT_HOSTNAME}:443:127.0.0.1" \
              "${SNAPSHOT_URL}/latest.json" \
              | jq -e '.roles | index("latest") != null' > /dev/null

      - name: Verify snapshot services
        if: ${{ env.FULL_STACK == 'true' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.SNAPSHOT_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: SNAPSHOT_HOST,SNAPSHOT_URL
          script: |
            systemctl is-active --quiet svoted
            systemctl is-enabled --quiet snapshot.timer
            curl -sf --resolve "${SNAPSHOT_HOST}:443:127.0.0.1" \
              "${SNAPSHOT_URL}/" > /dev/null
            echo "Snapshot node and frontend healthy."

  reset-secondary:
    name: Reset secondary (join)
    runs-on: ubuntu-latest
    needs: fund-secondary
    steps:
      - name: Install tag and join
        uses: appleboy/ssh-action@v1.0.3
        timeout-minutes: 30
        with:
          host: ${{ env.SECONDARY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: TAG,GENESIS_URL,PRIMARY_API_URL,CHAIN_ID
          script: |
            set -euo pipefail
            export PATH="/opt/shielded-vote/current/bin:$PATH"

            # Install the release
            /opt/shielded-vote/install-release.sh --tag "${TAG}" --skip-restart

            # Run reset-join with deterministic validator key
            export GENESIS_URL="${GENESIS_URL}"
            export PRIMARY_REST_URL="${SVOTE_PRIMARY_REST_URL:-${PRIMARY_API_URL}}"
            export VAL_PRIVKEY="${{ secrets.SECONDARY_VAL_PRIVKEY }}"
            export HOME_DIR=/opt/shielded-vote/.svoted
            export CHAIN_ID="${CHAIN_ID}"
            export MONIKER=valarg-secondary
            if [ -f /etc/default/svoted ]; then
              set -a
              . /etc/default/svoted
              set +a
              export GENESIS_URL="${GENESIS_URL}"
              export PRIMARY_REST_URL="${SVOTE_PRIMARY_REST_URL:-${PRIMARY_API_URL}}"
              export VAL_PRIVKEY="${{ secrets.SECONDARY_VAL_PRIVKEY }}"
              export HOME_DIR=/opt/shielded-vote/.svoted
              export CHAIN_ID="${CHAIN_ID}"
              export MONIKER=valarg-secondary
            fi

            curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/scripts/reset-join.sh" -o /tmp/reset-join.sh
            bash /tmp/reset-join.sh

      - name: Verify secondary health
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.SECONDARY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            for i in $(seq 1 20); do
              if curl -sf http://localhost:1317/shielded-vote/v1/rounds > /dev/null 2>&1; then
                echo "Secondary REST API healthy."
                exit 0
              fi
              echo "Waiting for secondary REST API... ($i/20)"
              sleep 15
            done
            echo "ERROR: Secondary REST API not healthy."
            exit 1

  reset-archive:
    name: Reset archive (join)
    runs-on: ubuntu-latest
    needs: [reset-secondary, reset-extra-validators]
    steps:
      - name: Skip archive reset for lean reset
        if: ${{ env.FULL_STACK != 'true' }}
        run: echo "full_stack=false; no archive node to reset."

      - name: Install tag and join as archive
        if: ${{ env.FULL_STACK == 'true' }}
        uses: appleboy/ssh-action@v1.0.3
        timeout-minutes: 30
        with:
          host: ${{ env.EXPLORER_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: TAG,GENESIS_URL,PRIMARY_API_URL,CHAIN_ID
          script: |
            set -euo pipefail
            export PATH="/opt/shielded-vote/current/bin:$PATH"

            # Install the release (skip restart — reset-archive.sh starts svoted).
            /opt/shielded-vote/install-release.sh --tag "${TAG}" --skip-restart

            # Run reset-archive: wipe state, download genesis, configure peering
            # with primary, start svoted in archive mode (pruning=nothing).
            export GENESIS_URL="${GENESIS_URL}"
            export PRIMARY_REST_URL="${SVOTE_PRIMARY_REST_URL:-${PRIMARY_API_URL}}"
            export HOME_DIR=/opt/shielded-vote/.svoted
            export CHAIN_ID="${CHAIN_ID}"
            export MONIKER=archive

            curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/scripts/reset-archive.sh" -o /tmp/reset-archive.sh
            bash /tmp/reset-archive.sh

      - name: Verify archive health
        if: ${{ env.FULL_STACK == 'true' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.EXPLORER_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            for i in $(seq 1 20); do
              if curl -sf http://localhost:1317/cosmos/base/tendermint/v1beta1/blocks/latest > /dev/null 2>&1; then
                echo "Archive REST API healthy."
                exit 0
              fi
              echo "Waiting for archive REST API... ($i/20)"
              sleep 15
            done
            echo "ERROR: Archive REST API not healthy."
            exit 1

      - name: Publish initial archive snapshot
        if: ${{ env.FULL_STACK == 'true' }}
        uses: appleboy/ssh-action@v1.0.3
        timeout-minutes: 60
        with:
          host: ${{ env.EXPLORER_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: SNAPSHOT_URL
          script: |
            set -euo pipefail

            PUBLIC_SNAPSHOT_URL="${SNAPSHOT_URL}"
            set -a
            . /etc/default/archive-snapshot
            set +a
            export SNAPSHOT_URL="${PUBLIC_SNAPSHOT_URL}"

            systemctl stop archive-snapshot.timer || true
            for i in $(seq 1 20); do
              if /opt/shielded-vote/archive-snapshot-publish.sh; then
                systemctl enable --now archive-snapshot.timer
                echo "Initial archive snapshot published."
                break
              fi
              if [ "$i" = "20" ]; then
                echo "ERROR: Initial archive snapshot publish failed after retries."
                systemctl enable --now archive-snapshot.timer || true
                exit 1
              fi
              echo "Archive node is not ready to publish yet; retrying... ($i/20)"
              systemctl reset-failed archive-snapshot.service || true
              sleep 30
            done

            curl -fsS "${SNAPSHOT_URL}/archive/latest.json" \
              | jq -e '.type == "archive" and (.roles | index("latest")) and (.roles | index("archive"))' > /dev/null
            curl -fsS "${SNAPSHOT_URL}/archive/snapshots.json" \
              | jq -e 'length == 1 and .[0].type == "archive"' > /dev/null
            echo "Archive snapshot metadata healthy."

  verify:
    name: Post-reset verification
    if: ${{ always() && needs.reset-archive.result == 'success' && needs.reset-snapshot.result == 'success' }}
    runs-on: ubuntu-latest
    needs: [reset-archive, reset-snapshot]
    steps:
      - name: Check both validators
        run: |
          FAILED=0

          VALIDATOR_CHECKS=("primary ${PRIMARY_API_URL}" "secondary ${SECONDARY_API_URL}")
          if [ -n "${EXTRA_VALIDATOR_API_URLS}" ]; then
            IFS=',' read -r -a EXTRA_URLS <<< "${EXTRA_VALIDATOR_API_URLS}"
            for idx in "${!EXTRA_URLS[@]}"; do
              URL="$(echo "${EXTRA_URLS[$idx]}" | xargs)"
              if [ -n "${URL}" ]; then
                VALIDATOR_CHECKS+=("val$((idx + 3)) ${URL}")
              fi
            done
          elif [ -n "${EXTRA_VALIDATOR_HOSTS}" ]; then
            IFS=',' read -r -a EXTRA_HOSTS <<< "${EXTRA_VALIDATOR_HOSTS}"
            for idx in "${!EXTRA_HOSTS[@]}"; do
              HOST="$(echo "${EXTRA_HOSTS[$idx]}" | xargs)"
              if [ -n "${HOST}" ]; then
                VALIDATOR_CHECKS+=("val$((idx + 3)) https://${HOST}")
              fi
            done
          fi

          for NAME_URL in "${VALIDATOR_CHECKS[@]}"; do
            NAME="${NAME_URL%% *}"
            BASE_URL="${NAME_URL#* }"
            URL="${BASE_URL}/shielded-vote/v1/rounds"
            for i in $(seq 1 10); do
              STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "$URL" || echo "000")
              if [ "$STATUS" = "200" ]; then
                echo "[OK] ${NAME} healthy"
                break
              fi
              if [ "$i" -eq 10 ]; then
                echo "[FAIL] ${NAME} not healthy (HTTP ${STATUS})"
                FAILED=1
              fi
              sleep 10
            done
          done
          if [ "${FULL_STACK}" = "true" ]; then
            # Explorer archive exposes the Cosmos LCD at explorer-api.<domain>.
            ARCHIVE_URL="${EXPLORER_API_URL}/cosmos/base/tendermint/v1beta1/blocks/latest"
            for i in $(seq 1 10); do
              STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "$ARCHIVE_URL" || echo "000")
              if [ "$STATUS" = "200" ]; then
                echo "[OK] explorer archive healthy"
                break
              fi
              if [ "$i" -eq 10 ]; then
                echo "[FAIL] explorer archive not healthy (HTTP ${STATUS})"
                FAILED=1
              fi
              sleep 10
            done
            for i in $(seq 1 10); do
              STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "${SNAPSHOT_URL}/" || echo "000")
              if [ "$STATUS" = "200" ]; then
                echo "[OK] snapshot frontend healthy"
                break
              fi
              if [ "$i" -eq 10 ]; then
                echo "[FAIL] snapshot frontend not healthy (HTTP ${STATUS})"
                FAILED=1
              fi
              sleep 10
            done
            for METADATA_PATH in /daily.json /latest.json /snapshots.json /archive/latest.json; do
              URL="${SNAPSHOT_URL}${METADATA_PATH}"
              if curl -fsS "$URL" | jq empty > /dev/null; then
                echo "[OK] snapshot metadata ${METADATA_PATH}"
              else
                echo "[FAIL] snapshot metadata ${METADATA_PATH}"
                FAILED=1
              fi
            done
          else
            echo "[SKIP] explorer archive checks (full_stack=false)"
            echo "[SKIP] snapshot frontend and metadata checks (full_stack=false)"
          fi
          exit $FAILED

  notify-slack:
    name: Slack Notification
    if: ${{ always() && contains(join(needs.*.result, ','), 'failure') }}
    needs: [quiesce-snapshot, quiesce-archive, reset-primary, upload-genesis, fund-secondary, reset-extra-validators, reset-snapshot, reset-secondary, reset-archive, verify]
    runs-on: ubuntu-latest
    steps:
      - name: Notify Slack on failure
        uses: slackapi/slack-github-action@v2.1.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "SDK Chain Reset failed",
              "blocks": [
                {
                  "type": "header",
                  "text": { "type": "plain_text", "text": "SDK Chain Reset Failed", "emoji": true }
                },
                {
                  "type": "section",
                  "fields": [
                    { "type": "mrkdwn", "text": "*Workflow:*\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Reset SDK Chain>" },
                    { "type": "mrkdwn", "text": "*Tag:*\n`${{ env.TAG }}`" }
                  ]
                },
                {
                  "type": "section",
                  "text": { "type": "mrkdwn", "text": "*Job Results:*\nQuiesce Snapshot: `${{ needs.quiesce-snapshot.result }}` | Quiesce Archive: `${{ needs.quiesce-archive.result }}` | Reset Primary: `${{ needs.reset-primary.result }}` | Upload Genesis: `${{ needs.upload-genesis.result }}` | Fund Secondary: `${{ needs.fund-secondary.result }}` | Reset Extra Validators: `${{ needs.reset-extra-validators.result }}` | Reset Snapshot: `${{ needs.reset-snapshot.result }}` | Reset Secondary: `${{ needs.reset-secondary.result }}` | Reset Archive: `${{ needs.reset-archive.result }}` | Verify: `${{ needs.verify.result }}`" }
                }
              ]
            }
