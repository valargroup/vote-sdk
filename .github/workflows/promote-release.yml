name: Promote release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Held stable release tag to promote (vN.N.N)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-promotion
  cancel-in-progress: false

jobs:
  promote:
    name: Promote ${{ inputs.tag }}
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_HOLD_TAG: ${{ vars.RELEASE_HOLD_TAG }}
      DO_ACCESS_KEY: ${{ secrets.DO_ACCESS_KEY }}
      DO_SECRET_KEY: ${{ secrets.DO_SECRET_KEY }}
      DO_SPACES_BUCKET: ${{ vars.DO_SPACES_BUCKET }}
      DO_SPACES_REGION: ${{ vars.DO_SPACES_REGION }}
      DO_SPACES_BASE: ${{ vars.DO_SPACES_BASE }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out held release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Validate held stable release
        run: |
          set -euo pipefail
          latest_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')"
          scripts/validate-release-promotion.sh \
            "$RELEASE_TAG" \
            "$RELEASE_HOLD_TAG" \
            "$latest_tag"
          [ "$(git rev-list -n 1 "$RELEASE_TAG")" = "$(git rev-parse HEAD)" ]

          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")"
          [ "$(jq -r '.draft' <<<"$release_json")" = "false" ]
          [ "$(jq -r '.prerelease' <<<"$release_json")" = "false" ]

      - name: Verify tag-scoped release artifacts
        run: |
          set -euo pipefail
          DO_SPACES_BUCKET="${DO_SPACES_BUCKET:-shielded-vote}"
          DO_SPACES_REGION="${DO_SPACES_REGION:-nyc3}"
          DO_SPACES_BASE="${DO_SPACES_BASE:-https://${DO_SPACES_BUCKET}.${DO_SPACES_REGION}.digitaloceanspaces.com}"

          for platform in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
            for suffix in "" ".sha256"; do
              curl -fsSIL --retry 3 --retry-delay 2 \
                "${DO_SPACES_BASE}/binaries/vote-sdk/shielded-vote-${RELEASE_TAG}-${platform}.tar.gz${suffix}" \
                >/dev/null
            done
          done

          for key in \
            "scripts/join-full/${RELEASE_TAG}/join-full.sh" \
            "scripts/join-common/${RELEASE_TAG}/_join_common.sh" \
            "scripts/join/${RELEASE_TAG}/join.sh" \
            "scripts/reset-validator-snapshot/${RELEASE_TAG}/reset-validator-snapshot.sh" \
            "scripts/remove-validator/${RELEASE_TAG}/remove-validator.sh" \
            "scripts/remove-pir/${RELEASE_TAG}/remove-pir.sh" \
            "scripts/svoted-wrapper/${RELEASE_TAG}/svoted-wrapper.sh" \
            "scripts/upgrade/${RELEASE_TAG}/update_chain.sh" \
            "scripts/upgrade/${RELEASE_TAG}/_chain_upgrade_common.sh" \
            "scripts/upgrade/${RELEASE_TAG}/prepare-upgrade-artifacts.sh"
          do
            curl -fsSIL --retry 3 --retry-delay 2 "${DO_SPACES_BASE}/${key}" >/dev/null
          done

      - name: Publish mutable release pointers
        run: |
          set -euo pipefail
          DO_SPACES_BUCKET="${DO_SPACES_BUCKET:-shielded-vote}"
          DO_SPACES_REGION="${DO_SPACES_REGION:-nyc3}"
          DO_SPACES_BASE="${DO_SPACES_BASE:-https://${DO_SPACES_BUCKET}.${DO_SPACES_REGION}.digitaloceanspaces.com}"

          pip install --quiet s3cmd
          cat > /tmp/do-spaces.s3cfg <<EOF
          [default]
          access_key = ${DO_ACCESS_KEY}
          secret_key = ${DO_SECRET_KEY}
          host_base = ${DO_SPACES_REGION}.digitaloceanspaces.com
          host_bucket = %(bucket)s.${DO_SPACES_REGION}.digitaloceanspaces.com
          bucket_location = ${DO_SPACES_REGION}
          use_https = True
          EOF

          DO_SPACES_BUCKET="$DO_SPACES_BUCKET" \
          DO_SPACES_REGION="$DO_SPACES_REGION" \
          DO_SPACES_BASE="$DO_SPACES_BASE" \
            scripts/publish-release-pointers.sh "$RELEASE_TAG" /tmp/do-spaces.s3cfg

      - name: Mark GitHub release latest
        run: gh release edit "$RELEASE_TAG" --latest --verify-tag

      - name: Verify promoted release channels
        run: |
          set -euo pipefail
          DO_SPACES_BUCKET="${DO_SPACES_BUCKET:-shielded-vote}"
          DO_SPACES_REGION="${DO_SPACES_REGION:-nyc3}"
          DO_SPACES_BASE="${DO_SPACES_BASE:-https://${DO_SPACES_BUCKET}.${DO_SPACES_REGION}.digitaloceanspaces.com}"

          [ "$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')" = "$RELEASE_TAG" ]
          [ "$(curl -fsSL --retry 3 --retry-delay 2 "${DO_SPACES_BASE}/version.txt")" = "$RELEASE_TAG" ]
          curl -fsSL --retry 3 --retry-delay 2 "${DO_SPACES_BASE}/update_chain.sh" \
            | grep -Fq "readonly UPDATE_DEFAULT_RELEASE_TAG='${RELEASE_TAG}'"
