# Build pre-compiled binaries and publish a GitHub Release on version tags.
#
# Tarball layout:
#   shielded-vote-<version>-<platform>/
#     bin/svoted, create-val-tx
#     ui/dist/                             (admin UI SPA)
#     explorer/dist/                       (ping-pub block explorer SPA)
#     systemd/svoted-val{1,2,3}.service    (Linux only)
#     scripts/init_multi.sh, reset-archive.sh, reset-validator-snapshot.sh,
#     svoted-wrapper.sh, _vote_manager_keys_lib.sh, _join_common.sh
#     config/Caddyfile
# Linux releases also publish a Cosmovisor archive containing only bin/svoted.
# Releases also publish the standalone Linux AMD64 voting-config verifier.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release-metadata:
    name: Resolve release channel
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.channel.outputs.prerelease }}
      make_latest: ${{ steps.channel.outputs.make_latest }}
      already_latest: ${{ steps.channel.outputs.already_latest }}
      publish_mutable_pointers: ${{ steps.channel.outputs.publish_mutable_pointers }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Classify release tag
        id: channel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_HOLD_TAG: ${{ vars.RELEASE_HOLD_TAG }}
        run: |
          repo_owner="${GITHUB_REPOSITORY%%/*}"
          repo_name="${GITHUB_REPOSITORY#*/}"
          latest_tag="$(
            gh api graphql \
              -f owner="$repo_owner" \
              -f name="$repo_name" \
              -f query="query(\$owner: String!, \$name: String!) {
                repository(owner: \$owner, name: \$name) {
                  latestRelease { tagName }
                }
              }" \
              --jq '.data.repository.latestRelease.tagName // empty'
          )"
          scripts/release-metadata.sh \
            "$GITHUB_REF_NAME" \
            "$RELEASE_HOLD_TAG" \
            "$latest_tag" \
            >> "$GITHUB_OUTPUT"

  build-sdk:
    name: Build SDK (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    needs: release-metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04 (glibc 2.35): linux-amd64 must not be built on 24.04+ or
          # binaries require GLIBC_2.39+ and fail on common 22.04 LTS hosts / DO images.
          - os: ubuntu-22.04
            platform: linux-amd64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
          - os: macos-latest
            platform: darwin-arm64
          - os: macos-latest
            platform: darwin-amd64
            cross: true
            rust_target: x86_64-apple-darwin
            goarch: amd64
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure private repo access
        run: git config --global url."https://x-access-token:${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/".insteadOf "ssh://git@github.com/"
      - name: Install mise
        uses: jdx/mise-action@v2
      - name: Add Rust cross target
        if: matrix.cross
        run: rustup target add ${{ matrix.rust_target }}
      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            circuits/target
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ matrix.platform }}-circuits-${{ hashFiles('circuits/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.platform }}-circuits-
      - name: Set build metadata
        run: |
          echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          echo "COMMIT=${GITHUB_SHA}" >> "$GITHUB_ENV"
      - name: Build SDK binaries
        env:
          BUILD_TAGS: halo2 redpallas
        run: |
          LDFLAGS="-X github.com/cosmos/cosmos-sdk/version.Name=shielded-vote \
                   -X github.com/cosmos/cosmos-sdk/version.AppName=svoted \
                   -X github.com/cosmos/cosmos-sdk/version.Version=${VERSION} \
                   -X github.com/cosmos/cosmos-sdk/version.Commit=${COMMIT} \
                   -X 'github.com/cosmos/cosmos-sdk/version.BuildTags=${BUILD_TAGS}'"
          if [ "${{ matrix.cross }}" = "true" ]; then
            cargo build --release --manifest-path circuits/Cargo.toml --no-default-features --features zakura --target ${{ matrix.rust_target }}
            mkdir -p circuits/target/release
            ln -sf "$(pwd)/circuits/target/${{ matrix.rust_target }}/release/libshielded_vote_circuits.a" \
                   circuits/target/release/libshielded_vote_circuits.a
            CC="clang -target x86_64-apple-macosx" \
            CGO_CFLAGS="-target x86_64-apple-macosx" \
            CGO_LDFLAGS="-target x86_64-apple-macosx" \
            CGO_ENABLED=1 GOOS=darwin GOARCH=${{ matrix.goarch }} \
              go build -tags "halo2,redpallas" -ldflags "${LDFLAGS}" -o svoted ./cmd/svoted
            CGO_ENABLED=0 GOOS=darwin GOARCH=${{ matrix.goarch }} go build -ldflags "${LDFLAGS}" -o create-val-tx ./scripts/create-val-tx
          else
            mise run build
            mise run build:create-val-tx
          fi
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sdk-binaries-${{ matrix.platform }}
          path: |
            svoted
            create-val-tx

  build-voting-config:
    name: Build voting-config (linux-amd64)
    runs-on: ubuntu-22.04
    needs: release-metadata
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.3"
          cache-dependency-path: go.sum
      - name: Test and build voting-config
        run: |
          set -euo pipefail
          go test -count=1 ./internal/votingconfig/... ./cmd/voting-config/...
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            make build-voting-config \
              VERSION="${GITHUB_REF_NAME}" \
              COMMIT="${GITHUB_SHA}"
          mv voting-config voting-config-linux-amd64
          ./voting-config-linux-amd64 --help >/dev/null
          sha256sum voting-config-linux-amd64 > voting-config-linux-amd64.sha256
          sha256sum --check voting-config-linux-amd64.sha256
      - name: Upload voting-config artifact
        uses: actions/upload-artifact@v4
        with:
          name: voting-config-linux-amd64
          path: |
            voting-config-linux-amd64
            voting-config-linux-amd64.sha256

  build-explorer:
    name: Build explorer frontend
    runs-on: ubuntu-latest
    needs: release-metadata
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: deploy/explorer
          sparse-checkout-cone-mode: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Enable corepack (yarn 1.x)
        run: corepack enable
      - name: Cache yarn packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/yarn
          key: yarn-pingpub-ee1ca5ee54d7bd2dc4c5b4df8f3b93595440e9c8
      - name: Clone ping-pub and build static bundle
        run: |
          set -euo pipefail
          git clone https://github.com/ping-pub/explorer.git /tmp/ping-pub
          cd /tmp/ping-pub
          git checkout ee1ca5ee54d7bd2dc4c5b4df8f3b93595440e9c8

          # Drop all upstream chain configs so the UI shows only our chain.
          rm -f chains/mainnet/*.json chains/testnet/*.json

          # Keep the chain config as a deploy-time template. The deploy/reset
          # workflows render environment-specific DNS and chain ID values.
          # ping-pub defaults to "mainnet" when the hostname doesn't contain
          # "testnet"; our svote config lives under chains/mainnet/ so it's
          # discoverable on the explorer host.
          cp "$GITHUB_WORKSPACE/deploy/explorer/svote.json" chains/mainnet/svote.json

          # Bundle the Zcash logo so the chain icon resolves to our asset.
          # ping-pub's repo doesn't ship a public/logos/ directory -- create it.
          # The built menu also references a few default upstream logos; bundle
          # them locally so missing image paths don't fall through to index.html.
          mkdir -p public/logos
          cp "$GITHUB_WORKSPACE/deploy/explorer/zcash.svg" public/logos/zcash.svg
          curl -fsSL --retry 3 -o public/logos/cosmos.svg https://ping.pub/logos/cosmos.svg
          curl -fsSL --retry 3 -o public/logos/osmosis.jpg https://ping.pub/logos/osmosis.jpg
          curl -fsSL --retry 3 -o public/logos/celestia.png https://ping.pub/logos/celestia.png

          yarn install
          yarn build
          tar czf "$GITHUB_WORKSPACE/explorer-dist.tar.gz" -C dist .
      - name: Upload explorer artifact
        uses: actions/upload-artifact@v4
        with:
          name: explorer-dist
          path: explorer-dist.tar.gz

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [release-metadata, build-sdk, build-voting-config, build-explorer]
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PRERELEASE: ${{ needs.release-metadata.outputs.prerelease }}
        run: |
          set -euo pipefail
          if release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" 2>/dev/null)"; then
            [ "$(jq -r '.draft' <<<"$release_json")" = "false" ]
            [ "$(jq -r '.prerelease' <<<"$release_json")" = "$PRERELEASE" ]
          else
            release_args=(--generate-notes --latest=false --verify-tag)
            if [ "$PRERELEASE" = "true" ]; then
              release_args+=(--prerelease)
            fi
            gh release create "$GITHUB_REF_NAME" "${release_args[@]}"
          fi

  release-voting-config:
    name: Release voting-config (linux-amd64)
    runs-on: ubuntu-latest
    needs: create-release
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download voting-config artifact
        uses: actions/download-artifact@v4
        with:
          name: voting-config-linux-amd64
      - name: Verify and attach to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          sha256sum --check voting-config-linux-amd64.sha256
          chmod +x voting-config-linux-amd64
          gh release upload "${GITHUB_REF_NAME}" \
            voting-config-linux-amd64 \
            voting-config-linux-amd64.sha256 \
            --clobber
          scripts/verify-voting-config-release-asset.sh "${GITHUB_REF_NAME}"

  release:
    name: Package and release (${{ matrix.platform }})
    runs-on: ubuntu-latest
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            os_family: linux
          - platform: linux-arm64
            os_family: linux
          - platform: darwin-amd64
            os_family: darwin
          - platform: darwin-arm64
            os_family: darwin
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build admin UI
        working-directory: ui
        run: npm ci && npm run build
      - name: Download SDK binaries
        uses: actions/download-artifact@v4
        with:
          name: sdk-binaries-${{ matrix.platform }}
          path: sdk-binaries
      - name: Download explorer dist
        uses: actions/download-artifact@v4
        with:
          name: explorer-dist
          path: explorer-artifact
      - name: Assemble tarball
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          DIR="shielded-vote-${VERSION}-${{ matrix.platform }}"
          mkdir -p "${DIR}/bin" "${DIR}/ui" "${DIR}/explorer/dist" "${DIR}/scripts" "${DIR}/config"
          cp sdk-binaries/svoted sdk-binaries/create-val-tx "${DIR}/bin/"
          chmod +x "${DIR}/bin/"*
          cp -r ui/dist "${DIR}/ui/dist"
          tar xzf explorer-artifact/explorer-dist.tar.gz -C "${DIR}/explorer/dist"
          if [ "${{ matrix.os_family }}" = "linux" ]; then
            mkdir -p "${DIR}/systemd"
            for f in docs/svoted-val{1,2,3}.service; do
              name=$(basename "$f")
              sed -e 's|/opt/shielded-vote|/opt/shielded-vote|g' \
                  -e 's|ExecStart=/opt/shielded-vote/svoted|ExecStart=/opt/shielded-vote/bin/svoted|' \
                  "$f" > "${DIR}/systemd/${name}"
            done
          fi
          cp join-full.sh "${DIR}/scripts/"
          chmod +x "${DIR}/scripts/join-full.sh"
          cp scripts/init_multi.sh scripts/_vote_manager_keys_lib.sh "${DIR}/scripts/"
          cp scripts/_join_common.sh "${DIR}/scripts/"
          chmod +x "${DIR}/scripts/_join_common.sh"
          cp scripts/render-explorer-dist.sh "${DIR}/scripts/"
          chmod +x "${DIR}/scripts/render-explorer-dist.sh"
          cp scripts/reset-archive.sh "${DIR}/scripts/"
          chmod +x "${DIR}/scripts/reset-archive.sh"
          cp scripts/reset-validator-snapshot.sh "${DIR}/scripts/"
          chmod +x "${DIR}/scripts/reset-validator-snapshot.sh"
          cp scripts/remove-validator.sh scripts/remove-pir.sh "${DIR}/scripts/"
          chmod +x "${DIR}/scripts/remove-validator.sh" "${DIR}/scripts/remove-pir.sh"
          cp scripts/svoted-wrapper.sh "${DIR}/scripts/"
          chmod +x "${DIR}/scripts/svoted-wrapper.sh"
          cp deploy/Caddyfile "${DIR}/config/"
          tar czf "${DIR}.tar.gz" "${DIR}"
          sha256sum "${DIR}.tar.gz" > "${DIR}.tar.gz.sha256"
          echo "TARBALL=${DIR}.tar.gz" >> "$GITHUB_ENV"
          if [ "${{ matrix.os_family }}" = "linux" ]; then
            COSMOVISOR_TARBALL="$(scripts/package-cosmovisor-archive.sh \
              "$VERSION" \
              "${{ matrix.platform }}" \
              sdk-binaries/svoted)"
            echo "COSMOVISOR_TARBALL=${COSMOVISOR_TARBALL}" >> "$GITHUB_ENV"
          fi
      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-tarball-${{ matrix.platform }}
          path: |
            ${{ env.TARBALL }}
            ${{ env.TARBALL }}.sha256
      - name: Upload Cosmovisor tarball artifact
        if: matrix.os_family == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: cosmovisor-tarball-${{ matrix.platform }}
          path: |
            ${{ env.COSMOVISOR_TARBALL }}
            ${{ env.COSMOVISOR_TARBALL }}.sha256
      - name: Attach to GitHub Release
        run: |
          set -euo pipefail
          assets=("${TARBALL}" "${TARBALL}.sha256")
          if [ -n "${COSMOVISOR_TARBALL:-}" ]; then
            assets+=("${COSMOVISOR_TARBALL}" "${COSMOVISOR_TARBALL}.sha256")
          fi
          gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  distribute:
    name: Distribute to server
    runs-on: ubuntu-latest
    needs: [release, release-metadata]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download linux-amd64 release tarball
        uses: actions/download-artifact@v4
        with:
          name: release-tarball-linux-amd64
      - name: Download linux-arm64 release tarball
        uses: actions/download-artifact@v4
        with:
          name: release-tarball-linux-arm64
      - name: Download darwin-amd64 release tarball
        uses: actions/download-artifact@v4
        with:
          name: release-tarball-darwin-amd64
      - name: Download darwin-arm64 release tarball
        uses: actions/download-artifact@v4
        with:
          name: release-tarball-darwin-arm64
      - name: Set version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
      - name: Upload to DigitalOcean Spaces
        env:
          DO_ACCESS_KEY: ${{ secrets.DO_ACCESS_KEY }}
          DO_SECRET_KEY: ${{ secrets.DO_SECRET_KEY }}
          DO_SPACES_BUCKET: ${{ vars.DO_SPACES_BUCKET }}
          DO_SPACES_REGION: ${{ vars.DO_SPACES_REGION }}
          DO_SPACES_BASE: ${{ vars.DO_SPACES_BASE }}
        run: |
          set -euo pipefail
          DO_SPACES_BUCKET="${DO_SPACES_BUCKET:-shielded-vote}"
          DO_SPACES_REGION="${DO_SPACES_REGION:-nyc3}"
          DO_SPACES_BASE="${DO_SPACES_BASE:-https://${DO_SPACES_BUCKET}.${DO_SPACES_REGION}.digitaloceanspaces.com}"
          pip install --quiet s3cmd
          cat > /tmp/do-spaces.s3cfg <<EOF
          [default]
          access_key = ${DO_ACCESS_KEY}
          secret_key = ${DO_SECRET_KEY}
          host_base = ${DO_SPACES_REGION}.digitaloceanspaces.com
          host_bucket = %(bucket)s.${DO_SPACES_REGION}.digitaloceanspaces.com
          bucket_location = ${DO_SPACES_REGION}
          use_https = True
          EOF
          for PLATFORM in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
            TARBALL="shielded-vote-${VERSION}-${PLATFORM}.tar.gz"
            s3cmd -c /tmp/do-spaces.s3cfg put "${TARBALL}" "s3://${DO_SPACES_BUCKET}/binaries/vote-sdk/" --acl-public --force
            s3cmd -c /tmp/do-spaces.s3cfg put "${TARBALL}.sha256" "s3://${DO_SPACES_BUCKET}/binaries/vote-sdk/" --acl-public --force
          done
          VERSIONED_UPDATE_CHAIN="$(mktemp)"
          scripts/render-update-chain.sh \
            "$VERSION" \
            "$DO_SPACES_BASE" \
            "${DO_SPACES_BASE%/}/scripts/upgrade/${VERSION}/_chain_upgrade_common.sh" \
            "${DO_SPACES_BASE%/}/scripts/upgrade/${VERSION}/update_chain.sh" \
            > "${VERSIONED_UPDATE_CHAIN}"
          s3cmd -c /tmp/do-spaces.s3cfg put -m text/plain --acl-public --force "${VERSIONED_UPDATE_CHAIN}" \
            "s3://${DO_SPACES_BUCKET}/scripts/upgrade/${VERSION}/update_chain.sh"
          rm -f "${VERSIONED_UPDATE_CHAIN}"
          s3cmd -c /tmp/do-spaces.s3cfg put -m text/plain --acl-public --force scripts/_chain_upgrade_common.sh \
            "s3://${DO_SPACES_BUCKET}/scripts/upgrade/${VERSION}/_chain_upgrade_common.sh"
          s3cmd -c /tmp/do-spaces.s3cfg put -m text/plain --acl-public --force scripts/prepare-upgrade-artifacts.sh \
            "s3://${DO_SPACES_BUCKET}/scripts/upgrade/${VERSION}/prepare-upgrade-artifacts.sh"
          s3cmd -c /tmp/do-spaces.s3cfg put -m text/plain --acl-public --force join.sh \
            "s3://${DO_SPACES_BUCKET}/scripts/join/${VERSION}/join.sh"
          VERSIONED_JOIN_FULL="$(mktemp)"
          sed "s|^SVOTE_JOIN_COMMON_VERSION=.*|SVOTE_JOIN_COMMON_VERSION=\"\${SVOTE_JOIN_COMMON_VERSION:-${VERSION}}\"|" \
            join-full.sh > "${VERSIONED_JOIN_FULL}"
          s3cmd -c /tmp/do-spaces.s3cfg put -m text/plain --acl-public --force "${VERSIONED_JOIN_FULL}" \
            "s3://${DO_SPACES_BUCKET}/scripts/join-full/${VERSION}/join-full.sh"
          rm -f "${VERSIONED_JOIN_FULL}"
          s3cmd -c /tmp/do-spaces.s3cfg put -m text/plain --acl-public --force scripts/_join_common.sh \
            "s3://${DO_SPACES_BUCKET}/scripts/join-common/${VERSION}/_join_common.sh"
          s3cmd -c /tmp/do-spaces.s3cfg put -m text/plain --acl-public --force scripts/reset-validator-snapshot.sh \
            "s3://${DO_SPACES_BUCKET}/scripts/reset-validator-snapshot/${VERSION}/reset-validator-snapshot.sh"
          s3cmd -c /tmp/do-spaces.s3cfg put -m text/plain --acl-public --force scripts/remove-validator.sh \
            "s3://${DO_SPACES_BUCKET}/scripts/remove-validator/${VERSION}/remove-validator.sh"
          s3cmd -c /tmp/do-spaces.s3cfg put -m text/plain --acl-public --force scripts/remove-pir.sh \
            "s3://${DO_SPACES_BUCKET}/scripts/remove-pir/${VERSION}/remove-pir.sh"
          s3cmd -c /tmp/do-spaces.s3cfg put -m text/plain --acl-public --force scripts/svoted-wrapper.sh \
            "s3://${DO_SPACES_BUCKET}/scripts/svoted-wrapper/${VERSION}/svoted-wrapper.sh"
      - name: Verify DigitalOcean Spaces uploads
        env:
          DO_SPACES_BUCKET: ${{ vars.DO_SPACES_BUCKET }}
          DO_SPACES_REGION: ${{ vars.DO_SPACES_REGION }}
          DO_SPACES_BASE: ${{ vars.DO_SPACES_BASE }}
        run: |
          set -euo pipefail
          DO_SPACES_BUCKET="${DO_SPACES_BUCKET:-shielded-vote}"
          DO_SPACES_REGION="${DO_SPACES_REGION:-nyc3}"
          DO_SPACES_BASE="${DO_SPACES_BASE:-https://${DO_SPACES_BUCKET}.${DO_SPACES_REGION}.digitaloceanspaces.com}"

          for PLATFORM in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
            for SUFFIX in "" ".sha256"; do
              URL="${DO_SPACES_BASE}/binaries/vote-sdk/shielded-vote-${VERSION}-${PLATFORM}.tar.gz${SUFFIX}"
              curl -fsSIL --retry 3 --retry-delay 2 "$URL" > /dev/null
              echo "[OK] $URL"
            done
          done

          TAG_SCOPED_KEYS=(
            "scripts/join-full/${VERSION}/join-full.sh" \
            "scripts/join-common/${VERSION}/_join_common.sh" \
            "scripts/join/${VERSION}/join.sh" \
            "scripts/reset-validator-snapshot/${VERSION}/reset-validator-snapshot.sh" \
            "scripts/remove-validator/${VERSION}/remove-validator.sh" \
            "scripts/remove-pir/${VERSION}/remove-pir.sh" \
            "scripts/svoted-wrapper/${VERSION}/svoted-wrapper.sh" \
            "scripts/upgrade/${VERSION}/update_chain.sh" \
            "scripts/upgrade/${VERSION}/_chain_upgrade_common.sh" \
            "scripts/upgrade/${VERSION}/prepare-upgrade-artifacts.sh"
          )
          for KEY in "${TAG_SCOPED_KEYS[@]}"; do
            URL="${DO_SPACES_BASE}/${KEY}"
            curl -fsSIL --retry 3 --retry-delay 2 "$URL" > /dev/null
            echo "[OK] $URL"
          done

  publish-release-channel:
    name: Publish stable release channel
    if: needs.release-metadata.outputs.publish_mutable_pointers == 'true'
    runs-on: ubuntu-latest
    needs: [release-metadata, distribute, release-voting-config]
    concurrency:
      group: release-channel
      cancel-in-progress: false
    env:
      DO_ACCESS_KEY: ${{ secrets.DO_ACCESS_KEY }}
      DO_SECRET_KEY: ${{ secrets.DO_SECRET_KEY }}
      DO_SPACES_BUCKET: ${{ vars.DO_SPACES_BUCKET }}
      DO_SPACES_REGION: ${{ vars.DO_SPACES_REGION }}
      DO_SPACES_BASE: ${{ vars.DO_SPACES_BASE }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate stable channel update
        run: |
          set -euo pipefail
          repo_owner="${GITHUB_REPOSITORY%%/*}"
          repo_name="${GITHUB_REPOSITORY#*/}"
          latest_tag="$(
            gh api graphql \
              -f owner="$repo_owner" \
              -f name="$repo_name" \
              -f query="query(\$owner: String!, \$name: String!) {
                repository(owner: \$owner, name: \$name) {
                  latestRelease { tagName }
                }
              }" \
              --jq '.data.repository.latestRelease.tagName // empty'
          )"
          scripts/validate-release-channel-update.sh \
            "$GITHUB_REF_NAME" \
            "$latest_tag"

      - name: Publish mutable release pointers
        run: |
          set -euo pipefail
          DO_SPACES_BUCKET="${DO_SPACES_BUCKET:-shielded-vote}"
          DO_SPACES_REGION="${DO_SPACES_REGION:-nyc3}"
          DO_SPACES_BASE="${DO_SPACES_BASE:-https://${DO_SPACES_BUCKET}.${DO_SPACES_REGION}.digitaloceanspaces.com}"
          DO_SPACES_BASE="${DO_SPACES_BASE%/}"

          pointer_sources="$(mktemp -d)"
          trap 'rm -rf "$pointer_sources"' EXIT
          scripts/fetch-release-pointer-sources.sh \
            "$GITHUB_REF_NAME" \
            "$DO_SPACES_BASE" \
            "$pointer_sources"

          pip install --quiet s3cmd
          cat > /tmp/do-spaces.s3cfg <<EOF
          [default]
          access_key = ${DO_ACCESS_KEY}
          secret_key = ${DO_SECRET_KEY}
          host_base = ${DO_SPACES_REGION}.digitaloceanspaces.com
          host_bucket = %(bucket)s.${DO_SPACES_REGION}.digitaloceanspaces.com
          bucket_location = ${DO_SPACES_REGION}
          use_https = True
          EOF

          DO_SPACES_BUCKET="$DO_SPACES_BUCKET" \
          DO_SPACES_REGION="$DO_SPACES_REGION" \
          DO_SPACES_BASE="$DO_SPACES_BASE" \
            scripts/publish-release-pointers.sh \
              "$GITHUB_REF_NAME" \
              /tmp/do-spaces.s3cfg \
              "$pointer_sources"

      - name: Verify mutable release pointers
        run: |
          set -euo pipefail
          DO_SPACES_BUCKET="${DO_SPACES_BUCKET:-shielded-vote}"
          DO_SPACES_REGION="${DO_SPACES_REGION:-nyc3}"
          DO_SPACES_BASE="${DO_SPACES_BASE:-https://${DO_SPACES_BUCKET}.${DO_SPACES_REGION}.digitaloceanspaces.com}"

          scripts/verify_upgrade_release_artifacts.sh \
            --mutable-only \
            "$GITHUB_REF_NAME" \
            "$DO_SPACES_BASE"

      - name: Mark GitHub release latest
        if: needs.release-metadata.outputs.make_latest == 'true'
        run: gh release edit "$GITHUB_REF_NAME" --latest --verify-tag

      - name: Verify GitHub release channel
        if: needs.release-metadata.outputs.make_latest == 'true'
        run: |
          set -euo pipefail
          [ "$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')" = "$GITHUB_REF_NAME" ]
