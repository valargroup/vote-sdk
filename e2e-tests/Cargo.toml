[package]
name = "e2e-tests"
version = "0.1.0"
edition = "2021"
description = "Rust E2E API tests for Shielded-Vote voting flow (replaces TypeScript suite)"

[dependencies]
# Keep the independent E2E graph on the upstream backend.
shielded-vote-circuits = { path = "../circuits", default-features = false, features = ["upstream"] }

orchard = { version = "0.16", features = ["unstable-voting-circuits"] }
voting-circuits = { version = "=0.15.0", default-features = false, features = ["lrz"] }
vote-commitment-tree = { version = "=0.9.0", default-features = false, features = ["lrz"] }
vote-commitment-tree-client = { version = "=0.11.0", default-features = false, features = ["http", "lrz"] }
zcash_voting = { version = "=5.4.1", default-features = false, features = ["lrz"] }

# Runs zcash_voting's async ChainSubmissionClient from the blocking tests.
tokio = { version = "1", features = ["rt-multi-thread", "time"] }

# HTTP and JSON
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Encoding
base64 = "0.22"
hex = "0.4"

# Round ID derivation (Poseidon hash)
halo2_gadgets = "=0.6.0"

# Blake2b (used by the voter throughput fixture)
blake2b_simd = "1"

# ElGamal on Pallas
pasta_curves = "0.6"
ff = "0.14"
group = "0.14"

# ECIES encryption (matching Go's sdk/crypto/ecies)
sha2 = "0.10"
chacha20poly1305 = "0.10"

# RNG
rand_core = "0.10"

# Delegation setup (Merkle tree)
incrementalmerkletree = "0.9"

[dev-dependencies]
rand_chacha = "0.10"
reddsa = "0.6"
zcash_keys = { version = "0.17", features = ["orchard"] }
zip32 = "0.3"

[workspace]

# ../circuits needs voting-circuits 0.15.0 plus ZKP4, and a patch only applies
# from the root of the workspace that builds it, so this crate repeats
# circuits/Cargo.toml's patch. Drop it once voting-circuits releases ZKP4.
[patch.crates-io]
voting-circuits = { git = "https://github.com/valargroup/voting-circuits", rev = "aa3ba600ddcd58db23d1c4e9de8c3ed2e28cdb56" }
voting-crypto-deps = { git = "https://github.com/valargroup/voting-circuits", rev = "aa3ba600ddcd58db23d1c4e9de8c3ed2e28cdb56" }
