[package]
name = "shielded-vote-circuits"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
description = "Halo2 ZKP circuits and FFI verification for the Shielded-Vote chain"

[lib]
crate-type = ["staticlib", "lib"]

[features]
default = ["zakura"]
upstream = [
    "voting-crypto-deps/lrz-validator",
    "voting-circuits/lrz",
    "imt-tree/upstream",
    "vote-commitment-tree/lrz",
    "dep:lrz-zcash-protocol",
]
zakura = [
    "voting-crypto-deps/validator",
    "voting-circuits/default",
    "imt-tree/zakura",
    "vote-commitment-tree/zakura",
    "dep:zcash_protocol",
]

[dependencies]
voting-crypto-deps = { version = "=0.4.0", default-features = false }
vote-commitment-tree = { version = "=0.8.0", default-features = false }
voting-circuits = { version = "=0.14.0", default-features = false }
imt-tree = { version = "=0.7.0", default-features = false }
nonempty = "0.11"
hex = "0.4"

# Select the same protocol types used by the selected transaction library.
zcash_protocol = { package = "zakura-protocol", version = "=4.0.0", default-features = false, optional = true }
lrz-zcash-protocol = { package = "zcash_protocol", version = "=0.11.0-pre.0", default-features = false, optional = true }

[dev-dependencies]
blake2b_simd = "1"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace]
