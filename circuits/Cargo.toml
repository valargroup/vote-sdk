[package]
name = "shielded-vote-circuits"
version = "0.1.0"
edition = "2021"
description = "Halo2 ZKP circuits and FFI verification for the Shielded-Vote chain"

[lib]
crate-type = ["staticlib", "lib"]

[dependencies]
halo2_proofs = { version = "0.3", features = ["batch"] }
pasta_curves = "0.5"
group = "0.13"
rand_core = { version = "0.6", features = ["getrandom"] }
reddsa = { version = "0.5", default-features = false }
vote-commitment-tree = "=0.4.0-rc.2"
orchard = { version = "0.15", features = ["unstable-voting-circuits"] }
voting-circuits = "=0.9.0-rc.3"
imt-tree = "0.2.1"
incrementalmerkletree = "0.8"
nonempty = "0.11"
zcash_primitives = { version = "0.30", default-features = false, features = ["std"] }
zcash_protocol = "0.10"
hex = "0.4"
halo2_gadgets = "=0.5.0"

[dependencies.ff]
version = "0.13"

[dev-dependencies]
rand_core = { version = "0.6", features = ["getrandom"] }
rand = "0.8"
reddsa = { version = "0.5", features = ["std"] }
blake2b_simd = "1"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace]
