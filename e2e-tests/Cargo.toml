[package]
name = "e2e-tests"
version = "0.1.0"
edition = "2021"
description = "Rust E2E API tests for Shielded-Vote voting flow (replaces TypeScript suite)"

[dependencies]
# Same-repo path dep (circuits/ is a sibling directory)
shielded-vote-circuits = { path = "../circuits" }

orchard = { version = "=0.15.0", features = ["unstable-voting-circuits"] }
voting-circuits = "=0.9.0-rc.2"
vote-commitment-tree = { version = "=0.3.2", git = "https://github.com/valargroup/zcash_voting", rev = "e1cb0b24631832b441b3285463fa569c20dbccc6" }
vote-commitment-tree-client = { version = "=0.5.2", git = "https://github.com/valargroup/zcash_voting", rev = "e1cb0b24631832b441b3285463fa569c20dbccc6", features = ["http"] }
zcash_voting = { version = "=1.0.0", git = "https://github.com/valargroup/zcash_voting", rev = "e1cb0b24631832b441b3285463fa569c20dbccc6" }

# HTTP and JSON
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Encoding
base64 = "0.22"
hex = "0.4"

# Round ID derivation (Poseidon hash)
halo2_gadgets = "=0.5.0"

# Blake2b (still used for sighash in e2e setup)
blake2b_simd = "1"

# ElGamal on Pallas
pasta_curves = "0.5"
ff = "0.13"
group = "0.13"

# ECIES encryption (matching Go's sdk/crypto/ecies)
sha2 = "0.10"
chacha20poly1305 = "0.10"

# RNG
rand = "0.8"
rand_core = "0.6"

# Delegation setup (Merkle tree)
incrementalmerkletree = "0.8"

[dev-dependencies]
rand = "0.8"
rand_chacha = "0.3"

[patch.crates-io]
# Temporary until these PIR release candidates are published.
pir-client = { git = "https://github.com/valargroup/vote-nullifier-pir", rev = "c8f70cb26a3c55e570fe9024cae3170e78f87bf8" }
pir-types = { git = "https://github.com/valargroup/vote-nullifier-pir", rev = "c8f70cb26a3c55e570fe9024cae3170e78f87bf8" }

[patch."https://github.com/valargroup/vote-nullifier-pir"]
imt-tree = "=0.2.0"

[workspace]
