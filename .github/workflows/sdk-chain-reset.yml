# Reset the full SDK chain fleet from genesis: quiesce the snapshot publisher,
# wipe state, re-init primary with deterministic keys, upload genesis to DO
# Spaces, reset the snapshot node, fund the secondary from a vote manager, then
# join secondary and archive.
# Manual-only: triggered via workflow_dispatch with a release tag.

name: Reset SDK Chain

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to deploy (e.g. v1.2.3). Must already exist in DO Spaces."
        type: string
        required: true
      target_environment:
        description: "GitHub Environment to read reset secrets and variables from."
        type: choice
        options:
          - staging
          - production
        default: staging
        required: true

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag }}

jobs:
  resolve-environment:
    name: Resolve environment settings
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment }}
    outputs:
      chain_id: ${{ steps.resolve.outputs.chain_id }}
      dns_prefix: ${{ steps.resolve.outputs.dns_prefix }}
      has_secondary: ${{ steps.resolve.outputs.has_secondary }}
      do_spaces_bucket: ${{ steps.resolve.outputs.do_spaces_bucket }}
      do_spaces_region: ${{ steps.resolve.outputs.do_spaces_region }}
      do_spaces_base: ${{ steps.resolve.outputs.do_spaces_base }}
      release_base_url: ${{ steps.resolve.outputs.release_base_url }}
      genesis_key: ${{ steps.resolve.outputs.genesis_key }}
      snapshots_prefix: ${{ steps.resolve.outputs.snapshots_prefix }}
      voting_config_url: ${{ steps.resolve.outputs.voting_config_url }}
    steps:
      - name: Resolve GitHub Environment variables
        id: resolve
        env:
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
          CHAIN_ID: ${{ vars.CHAIN_ID }}
          DNS_PREFIX: ${{ vars.DNS_PREFIX }}
          HAS_SECONDARY: ${{ vars.HAS_SECONDARY }}
          DO_SPACES_BUCKET: ${{ vars.DO_SPACES_BUCKET }}
          DO_SPACES_REGION: ${{ vars.DO_SPACES_REGION }}
          DO_SPACES_BASE: ${{ vars.DO_SPACES_BASE }}
          RELEASE_BASE_URL: ${{ vars.RELEASE_BASE_URL }}
          GENESIS_KEY: ${{ vars.GENESIS_KEY }}
          SNAPSHOTS_PREFIX: ${{ vars.SNAPSHOTS_PREFIX }}
          VOTING_CONFIG_URL: ${{ vars.VOTING_CONFIG_URL }}
        run: |
          set -euo pipefail
          if [ "$TARGET_ENVIRONMENT" = "production" ]; then
            default_chain_id="zvote-1"
            default_dns_prefix="prod."
            default_has_secondary="false"
            default_voting_config_url="https://raw.githubusercontent.com/valargroup/token-holder-voting-config/main/prod/"
          else
            default_chain_id="svote-1"
            default_dns_prefix="stage."
            default_has_secondary="true"
            default_voting_config_url="https://raw.githubusercontent.com/valargroup/token-holder-voting-config/main/stage/"
          fi
          chain_id="${CHAIN_ID:-$default_chain_id}"
          dns_prefix="${DNS_PREFIX:-$default_dns_prefix}"
          has_secondary="${HAS_SECONDARY:-$default_has_secondary}"
          do_spaces_bucket="${DO_SPACES_BUCKET:-vote}"
          do_spaces_region="${DO_SPACES_REGION:-fra1}"
          do_spaces_base="${DO_SPACES_BASE:-https://${do_spaces_bucket}.${do_spaces_region}.digitaloceanspaces.com}"
          release_base_url="${RELEASE_BASE_URL:-${do_spaces_base}/binaries/vote-sdk}"
          genesis_key="${GENESIS_KEY:-genesis/${chain_id}/genesis.json}"
          snapshots_prefix="${SNAPSHOTS_PREFIX:-snapshots/${chain_id}}"
          voting_config_url="${VOTING_CONFIG_URL:-$default_voting_config_url}"
          {
            echo "chain_id=${chain_id}"
            echo "dns_prefix=${dns_prefix}"
            echo "has_secondary=${has_secondary}"
            echo "do_spaces_bucket=${do_spaces_bucket}"
            echo "do_spaces_region=${do_spaces_region}"
            echo "do_spaces_base=${do_spaces_base}"
            echo "release_base_url=${release_base_url}"
            echo "genesis_key=${genesis_key}"
            echo "snapshots_prefix=${snapshots_prefix}"
            echo "voting_config_url=${voting_config_url}"
          } >> "$GITHUB_OUTPUT"

  validate-tag:
    name: Validate release tag exists in DO Spaces
    runs-on: ubuntu-latest
    needs: resolve-environment
    environment: ${{ inputs.target_environment }}
    env:
      RELEASE_BASE_URL: ${{ needs.resolve-environment.outputs.release_base_url }}
    steps:
      - name: HEAD-check published tarballs
        run: |
          set -euo pipefail
          MISSING=0
          for PLATFORM in linux-amd64 linux-arm64; do
            URL="${RELEASE_BASE_URL}/shielded-vote-${TAG}-${PLATFORM}.tar.gz"
            STATUS=$(curl -sI -o /dev/null -w "%{http_code}" "$URL")
            if [ "$STATUS" = "200" ]; then
              echo "[OK]  ${PLATFORM} -> $URL"
            else
              echo "[MISSING] ${PLATFORM} (HTTP ${STATUS}) -> $URL"
              MISSING=1
            fi
          done
          if [ "$MISSING" -ne 0 ]; then
            echo ""
            echo "ERROR: tag '${TAG}' is not published. Refusing to proceed (would wipe chain state and then fail)."
            echo "  Confirm the tag was successfully built by release.yml and uploaded to the configured DO Spaces bucket."
            exit 1
          fi

  quiesce-snapshot:
    name: Quiesce snapshot publisher
    runs-on: ubuntu-latest
    needs: [resolve-environment, validate-tag]
    environment: ${{ inputs.target_environment }}
    steps:
      - name: Stop snapshot timer before chain reset
        uses: appleboy/ssh-action@v1.0.3
        timeout-minutes: 5
        with:
          host: ${{ secrets.SNAPSHOT_HOST || vars.SNAPSHOT_HOST || format('{0}snapshots.{1}', needs.resolve-environment.outputs.dns_prefix, secrets.DOMAIN) }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail

            # Stop publisher first so old chain state cannot republish stale
            # metadata after upload-genesis clears public snapshot artifacts.
            systemctl stop snapshot.timer
            systemctl disable snapshot.timer
            systemctl stop snapshot.service
            systemctl stop svoted
            systemctl reset-failed snapshot.timer snapshot.service svoted || true
            echo "Snapshot publisher quiesced."

  quiesce-archive:
    name: Quiesce archive publisher
    runs-on: ubuntu-latest
    needs: [resolve-environment, validate-tag]
    environment: ${{ inputs.target_environment }}
    steps:
      - name: Stop archive snapshot timer before chain reset
        uses: appleboy/ssh-action@v1.0.3
        timeout-minutes: 5
        with:
          host: ${{ secrets.EXPLORER_HOST || vars.EXPLORER_HOST || format('{0}explorer.{1}', needs.resolve-environment.outputs.dns_prefix, secrets.DOMAIN) }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail

            # Stop archive publishing before upload-genesis clears public
            # snapshot artifacts, so old archive state cannot republish after
            # the bucket prefix is wiped.
            systemctl stop archive-snapshot.timer || true
            systemctl disable archive-snapshot.timer || true
            systemctl stop archive-snapshot.service || true
            systemctl stop svoted || true
            systemctl reset-failed archive-snapshot.timer archive-snapshot.service svoted || true
            echo "Archive publisher quiesced."

  reset-primary:
    name: Reset primary (bootstrap)
    runs-on: ubuntu-latest
    needs: [resolve-environment, quiesce-snapshot, quiesce-archive]
    environment: ${{ inputs.target_environment }}
    env:
      CHAIN_ID: ${{ needs.resolve-environment.outputs.chain_id }}
      DNS_PREFIX: ${{ needs.resolve-environment.outputs.dns_prefix }}
      RELEASE_BASE_URL: ${{ needs.resolve-environment.outputs.release_base_url }}
      SENTRY_ENVIRONMENT: ${{ inputs.target_environment }}
      SVOTE_CONFIG_URL: ${{ needs.resolve-environment.outputs.voting_config_url }}
      # Staging: valarg-genesis / valarg-secondary split; production: single valargroup moniker.
      MONIKER: ${{ inputs.target_environment == 'production' && 'valargroup' || 'valarg-genesis' }}
    steps:
      - name: Install tag and reset primary
        uses: appleboy/ssh-action@v1.0.3
        timeout-minutes: 15
        with:
          host: ${{ secrets.PRIMARY_HOST || vars.PRIMARY_HOST || format('{0}vote-chain-primary.{1}', needs.resolve-environment.outputs.dns_prefix, secrets.DOMAIN) }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: TAG,SENTRY_DSN,SENTRY_ENVIRONMENT,SVOTE_CONFIG_PR_GITHUB_TOKEN,CHAIN_ID,DNS_PREFIX,DOMAIN,RELEASE_BASE_URL,SVOTE_CONFIG_URL,MONIKER
          script: |
            set -euo pipefail
            export PATH="/opt/shielded-vote/current/bin:$PATH"

            # Install the release
            /opt/shielded-vote/install-release.sh --tag "${TAG}" --base "${RELEASE_BASE_URL}" --skip-restart

            # Stop svoted
            systemctl stop svoted || true

            # Wipe chain state (preserve the releases dir)
            rm -rf /opt/shielded-vote/.svoted/*

            # Write Sentry DSN into the systemd EnvironmentFile
            sed -i '/^SENTRY_DSN=/d' /etc/default/svoted
            echo "SENTRY_DSN=$SENTRY_DSN" >> /etc/default/svoted
            sed -i '/^SENTRY_ENVIRONMENT=/d' /etc/default/svoted
            echo "SENTRY_ENVIRONMENT=$SENTRY_ENVIRONMENT" >> /etc/default/svoted
            sed -i '/^SVOTE_CONFIG_PR_GITHUB_TOKEN=/d' /etc/default/svoted
            if [ -n "${SVOTE_CONFIG_PR_GITHUB_TOKEN:-}" ]; then
              echo "SVOTE_CONFIG_PR_GITHUB_TOKEN=$SVOTE_CONFIG_PR_GITHUB_TOKEN" >> /etc/default/svoted
            fi
            if [ "$SENTRY_ENVIRONMENT" = "production" ]; then
              cat > /etc/default/caddy-env <<EOF
            DOMAIN=${DOMAIN}
            PRIMARY_HOSTS="vote-chain-primary.${DOMAIN}, prod-vote-chain-primary.${DOMAIN}, prod.vote-chain-primary.${DOMAIN}"
            RPC_PRIMARY_HOSTS="vote-rpc-primary.${DOMAIN}, prod-vote-rpc-primary.${DOMAIN}, prod.vote-rpc-primary.${DOMAIN}"
            SVOTE_HOSTS="svote.${DOMAIN}, prod.svote.${DOMAIN}"
            EOF
            else
              cat > /etc/default/caddy-env <<EOF
            DOMAIN=${DOMAIN}
            PRIMARY_HOSTS="${DNS_PREFIX}vote-chain-primary.${DOMAIN}"
            RPC_PRIMARY_HOSTS="${DNS_PREFIX}vote-rpc-primary.${DOMAIN}"
            SVOTE_HOSTS="${DNS_PREFIX}svote.${DOMAIN}"
            EOF
            fi
            systemctl restart caddy

            # Run init.sh with deterministic validator key and vote-manager set.
            export SVOTED_HOME=/opt/shielded-vote/.svoted
            export VM_PRIVKEYS="${{ secrets.VM_PRIVKEYS }}"
            export VAL_PRIVKEY="${{ secrets.PRIMARY_VAL_PRIVKEY }}"
            export SVOTE_ADMIN_DISABLE=false
            curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/scripts/init.sh" -o /tmp/init.sh
            curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/scripts/_genesis_accounts_lib.sh" -o /tmp/_genesis_accounts_lib.sh
            curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/scripts/_vote_manager_keys_lib.sh" -o /tmp/_vote_manager_keys_lib.sh
            bash /tmp/init.sh

            # Ensure the primary systemd drop-in exists (serves admin UI)
            mkdir -p /etc/systemd/system/svoted.service.d
            printf '[Service]\nExecStart=\nExecStart=/opt/shielded-vote/current/bin/svoted start --home /opt/shielded-vote/.svoted --serve-ui --ui-dist /opt/shielded-vote/current/ui/dist\n' \
              > /etc/systemd/system/svoted.service.d/primary.conf

            # Start svoted
            systemctl daemon-reload
            systemctl start svoted

            # Wait for REST API
            for i in $(seq 1 30); do
              if curl -sf http://localhost:1317/shielded-vote/v1/rounds > /dev/null 2>&1; then
                echo "Primary REST API healthy."
                exit 0
              fi
              echo "Waiting for primary REST API... ($i/30)"
              sleep 10
            done
            echo "ERROR: Primary REST API not healthy after 5 minutes."
            exit 1
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SVOTE_CONFIG_PR_GITHUB_TOKEN: ${{ secrets.CONFIG_PR_GITHUB_TOKEN }}
          DOMAIN: ${{ secrets.DOMAIN }}

  upload-genesis:
    name: Upload genesis to DO Spaces
    runs-on: ubuntu-latest
    needs: [resolve-environment, reset-primary]
    environment: ${{ inputs.target_environment }}
    env:
      DO_SPACES_BUCKET: ${{ needs.resolve-environment.outputs.do_spaces_bucket }}
      DO_SPACES_REGION: ${{ needs.resolve-environment.outputs.do_spaces_region }}
      GENESIS_KEY: ${{ needs.resolve-environment.outputs.genesis_key }}
      SNAPSHOTS_PREFIX: ${{ needs.resolve-environment.outputs.snapshots_prefix }}
    steps:
      - name: Fetch genesis and upload to DO Spaces
        uses: appleboy/ssh-action@v1.0.3
        timeout-minutes: 5
        with:
          host: ${{ secrets.PRIMARY_HOST || vars.PRIMARY_HOST || format('{0}vote-chain-primary.{1}', needs.resolve-environment.outputs.dns_prefix, secrets.DOMAIN) }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DO_ACCESS_KEY,DO_SECRET_KEY,DO_SPACES_BUCKET,DO_SPACES_REGION,GENESIS_KEY,SNAPSHOTS_PREFIX
          script: |
            set -euo pipefail

            # Fetch genesis from local REST API
            curl -fsSL http://localhost:1317/shielded-vote/v1/genesis > /tmp/genesis.json
            echo "Genesis fetched ($(wc -c < /tmp/genesis.json) bytes)."

            # Install s3cmd if not present
            which s3cmd > /dev/null 2>&1 || apt-get install -y -qq s3cmd

            # Upload directly to DO Spaces
            cat > /tmp/do-spaces.s3cfg <<EOCFG
            [default]
            access_key = ${DO_ACCESS_KEY}
            secret_key = ${DO_SECRET_KEY}
            host_base = ${DO_SPACES_REGION}.digitaloceanspaces.com
            host_bucket = %(bucket)s.${DO_SPACES_REGION}.digitaloceanspaces.com
            bucket_location = ${DO_SPACES_REGION}
            use_https = True
            EOCFG
            s3cmd -c /tmp/do-spaces.s3cfg put /tmp/genesis.json "s3://${DO_SPACES_BUCKET}/${GENESIS_KEY}" --acl-public --force
            echo "Clearing old snapshot artifacts from s3://${DO_SPACES_BUCKET}/${SNAPSHOTS_PREFIX}/..."
            s3cmd -c /tmp/do-spaces.s3cfg del --recursive "s3://${DO_SPACES_BUCKET}/${SNAPSHOTS_PREFIX}/"
            rm -f /tmp/do-spaces.s3cfg
            echo "Genesis uploaded to s3://${DO_SPACES_BUCKET}/${GENESIS_KEY}"
            echo "Old snapshots cleared from s3://${DO_SPACES_BUCKET}/${SNAPSHOTS_PREFIX}/"
        env:
          DO_ACCESS_KEY: ${{ secrets.DO_ACCESS_KEY }}
          DO_SECRET_KEY: ${{ secrets.DO_SECRET_KEY }}

  fund-secondary:
    name: Fund secondary validator
    runs-on: ubuntu-latest
    needs: [resolve-environment, upload-genesis]
    if: ${{ needs.resolve-environment.outputs.has_secondary != 'false' }}
    environment: ${{ inputs.target_environment }}
    env:
      CHAIN_ID: ${{ needs.resolve-environment.outputs.chain_id }}
    steps:
      - name: Send tokens from vote-manager to secondary address
        uses: appleboy/ssh-action@v1.0.3
        timeout-minutes: 5
        with:
          host: ${{ secrets.PRIMARY_HOST || vars.PRIMARY_HOST || format('{0}vote-chain-primary.{1}', needs.resolve-environment.outputs.dns_prefix, secrets.DOMAIN) }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: CHAIN_ID
          script: |
            set -euo pipefail
            export PATH="/opt/shielded-vote/current/bin:$PATH"
            HOME_DIR=/opt/shielded-vote/.svoted

            # Derive the secondary address from its private key without importing
            # it into the primary's keyring: import into a temp keyring, read
            # address, delete.
            TMPKR=$(mktemp -d)
            svoted keys import-hex secondary-tmp "${{ secrets.SECONDARY_VAL_PRIVKEY }}" \
              --keyring-backend test --home "$TMPKR"
            SECONDARY_ADDR=$(svoted keys show secondary-tmp -a --keyring-backend test --home "$TMPKR")
            rm -rf "$TMPKR"

            echo "Funding secondary address: ${SECONDARY_ADDR}"

            svoted tx vote authorized-send "${SECONDARY_ADDR}" 100000000 \
              --from vote-manager-1 \
              --keyring-backend test \
              --home "$HOME_DIR" \
              --chain-id "${CHAIN_ID}" \
              --yes

            echo "Waiting for tx to be included..."
            sleep 6

            BALANCE=$(svoted query bank balances "${SECONDARY_ADDR}" --home "$HOME_DIR" --output json \
              | jq -r '.balances[] | select(.denom == "usvote") | .amount')
            echo "Secondary balance: ${BALANCE} usvote"

  reset-snapshot:
    name: Reset snapshot node
    runs-on: ubuntu-latest
    needs: [resolve-environment, upload-genesis]
    environment: ${{ inputs.target_environment }}
    env:
      CHAIN_ID: ${{ needs.resolve-environment.outputs.chain_id }}
      DNS_PREFIX: ${{ needs.resolve-environment.outputs.dns_prefix }}
      DO_SPACES_BASE: ${{ needs.resolve-environment.outputs.do_spaces_base }}
      GENESIS_KEY: ${{ needs.resolve-environment.outputs.genesis_key }}
      DOMAIN: ${{ secrets.DOMAIN }}
      PRIMARY_REST_URL: ${{ vars.PRIMARY_REST_URL || format('https://{0}vote-chain-primary.{1}', needs.resolve-environment.outputs.dns_prefix, secrets.DOMAIN) }}
      RELEASE_BASE_URL: ${{ needs.resolve-environment.outputs.release_base_url }}
      SNAPSHOT_HOST: ${{ vars.SNAPSHOT_PUBLIC_HOST || format('{0}snapshots.{1}', needs.resolve-environment.outputs.dns_prefix, secrets.DOMAIN) }}
      SENTRY_ENVIRONMENT: ${{ inputs.target_environment }}
      VERIFY_PUBLIC_ENDPOINTS: ${{ vars.VERIFY_PUBLIC_ENDPOINTS || 'true' }}
    steps:
      - name: Install tag and join as snapshot node
        uses: appleboy/ssh-action@v1.0.3
        timeout-minutes: 30
        with:
          host: ${{ secrets.SNAPSHOT_HOST || vars.SNAPSHOT_HOST || format('{0}snapshots.{1}', needs.resolve-environment.outputs.dns_prefix, secrets.DOMAIN) }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: TAG,CHAIN_ID,DNS_PREFIX,DO_SPACES_BASE,GENESIS_KEY,DOMAIN,PRIMARY_REST_URL,RELEASE_BASE_URL,SENTRY_DSN,SENTRY_ENVIRONMENT
          script: |
            set -euo pipefail
            export PATH="/opt/shielded-vote/current/bin:$PATH"

            # Install the release (skip restart — reset-snapshot.sh starts svoted).
            /opt/shielded-vote/install-release.sh --tag "${TAG}" --base "${RELEASE_BASE_URL}" --skip-restart
            sed -i '/^SENTRY_DSN=/d' /etc/default/svoted
            echo "SENTRY_DSN=$SENTRY_DSN" >> /etc/default/svoted
            sed -i '/^SENTRY_ENVIRONMENT=/d' /etc/default/svoted
            echo "SENTRY_ENVIRONMENT=$SENTRY_ENVIRONMENT" >> /etc/default/svoted

            # Run reset-snapshot: wipe state, download genesis, configure peering
            # with primary, start svoted as a pruned non-validator, and enable
            # the snapshot timer.
            export GENESIS_URL="${DO_SPACES_BASE}/${GENESIS_KEY}"
            export PRIMARY_REST_URL="${PRIMARY_REST_URL}"
            export HOME_DIR=/opt/shielded-vote/.svoted
            export MONIKER=snapshot

            curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/scripts/reset-snapshot.sh" -o /tmp/reset-snapshot.sh
            bash /tmp/reset-snapshot.sh
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

      - name: Publish initial pruned snapshot
        uses: appleboy/ssh-action@v1.0.3
        timeout-minutes: 30
        with:
          host: ${{ secrets.SNAPSHOT_HOST || vars.SNAPSHOT_HOST || format('{0}snapshots.{1}', needs.resolve-environment.outputs.dns_prefix, secrets.DOMAIN) }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: SNAPSHOT_HOST,VERIFY_PUBLIC_ENDPOINTS
          script: |
            set -euo pipefail

            set -a
            . /etc/default/snapshot
            set +a

            systemctl stop snapshot.timer || true
            for i in $(seq 1 20); do
              if /opt/shielded-vote/snapshot-publish.sh; then
                systemctl enable --now snapshot.timer
                echo "Initial pruned snapshot published."
                break
              fi
              if [ "$i" = "20" ]; then
                echo "ERROR: Initial pruned snapshot publish failed after retries."
                systemctl enable --now snapshot.timer || true
                exit 1
              fi
              echo "Snapshot node is not ready to publish yet; retrying... ($i/20)"
              systemctl reset-failed snapshot.service || true
              sleep 30
            done

            if [ "${VERIFY_PUBLIC_ENDPOINTS}" = "false" ]; then
              echo "Skipping snapshot HTTPS metadata checks before DNS cutover."
            else
              for path in /daily.json /latest.json /snapshots.json; do
                curl -fsS --resolve "${SNAPSHOT_HOST}:443:127.0.0.1" \
                  "https://${SNAPSHOT_HOST}${path}" \
                  | jq -e 'type == "object" or type == "array"' > /dev/null
                echo "[OK] ${path}"
              done
              curl -fsS --resolve "${SNAPSHOT_HOST}:443:127.0.0.1" \
                "https://${SNAPSHOT_HOST}/daily.json" \
                | jq -e '.roles | index("daily") != null' > /dev/null
              curl -fsS --resolve "${SNAPSHOT_HOST}:443:127.0.0.1" \
                "https://${SNAPSHOT_HOST}/latest.json" \
                | jq -e '.roles | index("latest") != null' > /dev/null
            fi

      - name: Verify snapshot services
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SNAPSHOT_HOST || vars.SNAPSHOT_HOST || format('{0}snapshots.{1}', needs.resolve-environment.outputs.dns_prefix, secrets.DOMAIN) }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: SNAPSHOT_HOST,VERIFY_PUBLIC_ENDPOINTS
          script: |
            systemctl is-active --quiet svoted
            systemctl is-enabled --quiet snapshot.timer
            if [ "${VERIFY_PUBLIC_ENDPOINTS}" = "false" ]; then
              echo "Skipping snapshot frontend HTTPS check before DNS cutover."
            else
              curl -sf --resolve "${SNAPSHOT_HOST}:443:127.0.0.1" \
                "https://${SNAPSHOT_HOST}/" > /dev/null
            fi
            echo "Snapshot node and frontend healthy."

  reset-secondary:
    name: Reset secondary (join)
    runs-on: ubuntu-latest
    needs: [resolve-environment, fund-secondary]
    if: ${{ needs.resolve-environment.outputs.has_secondary != 'false' }}
    environment: ${{ inputs.target_environment }}
    env:
      CHAIN_ID: ${{ needs.resolve-environment.outputs.chain_id }}
      DNS_PREFIX: ${{ needs.resolve-environment.outputs.dns_prefix }}
      DO_SPACES_BASE: ${{ needs.resolve-environment.outputs.do_spaces_base }}
      GENESIS_KEY: ${{ needs.resolve-environment.outputs.genesis_key }}
      DOMAIN: ${{ secrets.DOMAIN }}
      PRIMARY_REST_URL: ${{ vars.PRIMARY_REST_URL || format('https://{0}vote-chain-primary.{1}', needs.resolve-environment.outputs.dns_prefix, secrets.DOMAIN) }}
      RELEASE_BASE_URL: ${{ needs.resolve-environment.outputs.release_base_url }}
      SENTRY_ENVIRONMENT: ${{ inputs.target_environment }}
    steps:
      - name: Install tag and join
        uses: appleboy/ssh-action@v1.0.3
        timeout-minutes: 30
        with:
          host: ${{ secrets.SECONDARY_HOST || vars.SECONDARY_HOST || format('{0}vote-chain-secondary.{1}', needs.resolve-environment.outputs.dns_prefix, secrets.DOMAIN) }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: TAG,CHAIN_ID,DNS_PREFIX,DO_SPACES_BASE,GENESIS_KEY,DOMAIN,PRIMARY_REST_URL,RELEASE_BASE_URL,SENTRY_DSN,SENTRY_ENVIRONMENT
          script: |
            set -euo pipefail
            export PATH="/opt/shielded-vote/current/bin:$PATH"

            # Install the release
            /opt/shielded-vote/install-release.sh --tag "${TAG}" --base "${RELEASE_BASE_URL}" --skip-restart
            sed -i '/^SENTRY_DSN=/d' /etc/default/svoted
            echo "SENTRY_DSN=$SENTRY_DSN" >> /etc/default/svoted
            sed -i '/^SENTRY_ENVIRONMENT=/d' /etc/default/svoted
            echo "SENTRY_ENVIRONMENT=$SENTRY_ENVIRONMENT" >> /etc/default/svoted

            # Run reset-join with deterministic validator key
            export GENESIS_URL="${DO_SPACES_BASE}/${GENESIS_KEY}"
            export PRIMARY_REST_URL="${PRIMARY_REST_URL}"
            export VAL_PRIVKEY="${{ secrets.SECONDARY_VAL_PRIVKEY }}"
            export HOME_DIR=/opt/shielded-vote/.svoted
            export MONIKER=valarg-secondary

            curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/scripts/reset-join.sh" -o /tmp/reset-join.sh
            bash /tmp/reset-join.sh
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

      - name: Verify secondary health
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SECONDARY_HOST || vars.SECONDARY_HOST || format('{0}vote-chain-secondary.{1}', needs.resolve-environment.outputs.dns_prefix, secrets.DOMAIN) }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            for i in $(seq 1 20); do
              if curl -sf http://localhost:1317/shielded-vote/v1/rounds > /dev/null 2>&1; then
                echo "Secondary REST API healthy."
                exit 0
              fi
              echo "Waiting for secondary REST API... ($i/20)"
              sleep 15
            done
            echo "ERROR: Secondary REST API not healthy."
            exit 1

  reset-archive:
    name: Reset archive (join)
    runs-on: ubuntu-latest
    needs: [resolve-environment, upload-genesis, reset-secondary]
    if: ${{ always() && needs.upload-genesis.result == 'success' && (needs.reset-secondary.result == 'success' || needs.reset-secondary.result == 'skipped') }}
    environment: ${{ inputs.target_environment }}
    env:
      CHAIN_ID: ${{ needs.resolve-environment.outputs.chain_id }}
      DNS_PREFIX: ${{ needs.resolve-environment.outputs.dns_prefix }}
      DO_SPACES_BASE: ${{ needs.resolve-environment.outputs.do_spaces_base }}
      GENESIS_KEY: ${{ needs.resolve-environment.outputs.genesis_key }}
      DOMAIN: ${{ secrets.DOMAIN }}
      PRIMARY_REST_URL: ${{ vars.PRIMARY_REST_URL || format('https://{0}vote-chain-primary.{1}', needs.resolve-environment.outputs.dns_prefix, secrets.DOMAIN) }}
      RELEASE_BASE_URL: ${{ needs.resolve-environment.outputs.release_base_url }}
      SNAPSHOT_HOST: ${{ vars.SNAPSHOT_PUBLIC_HOST || format('{0}snapshots.{1}', needs.resolve-environment.outputs.dns_prefix, secrets.DOMAIN) }}
      SENTRY_ENVIRONMENT: ${{ inputs.target_environment }}
      VERIFY_PUBLIC_ENDPOINTS: ${{ vars.VERIFY_PUBLIC_ENDPOINTS || 'true' }}
    steps:
      - name: Install tag and join as archive
        uses: appleboy/ssh-action@v1.0.3
        timeout-minutes: 30
        with:
          host: ${{ secrets.EXPLORER_HOST || vars.EXPLORER_HOST || format('{0}explorer.{1}', needs.resolve-environment.outputs.dns_prefix, secrets.DOMAIN) }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: TAG,CHAIN_ID,DNS_PREFIX,DO_SPACES_BASE,GENESIS_KEY,DOMAIN,PRIMARY_REST_URL,RELEASE_BASE_URL,SENTRY_DSN,SENTRY_ENVIRONMENT
          script: |
            set -euo pipefail
            export PATH="/opt/shielded-vote/current/bin:$PATH"

            # Install the release (skip restart — reset-archive.sh starts svoted).
            /opt/shielded-vote/install-release.sh --tag "${TAG}" --base "${RELEASE_BASE_URL}" --skip-restart
            sed -i '/^SENTRY_DSN=/d' /etc/default/svoted
            echo "SENTRY_DSN=$SENTRY_DSN" >> /etc/default/svoted
            sed -i '/^SENTRY_ENVIRONMENT=/d' /etc/default/svoted
            echo "SENTRY_ENVIRONMENT=$SENTRY_ENVIRONMENT" >> /etc/default/svoted

            if [ "$SENTRY_ENVIRONMENT" = "production" ]; then
              cat > /etc/default/caddy-env <<EOF
            DOMAIN=${DOMAIN}
            EXPLORER_HOSTS="explorer.${DOMAIN}, prod-explorer.${DOMAIN}, prod.explorer.${DOMAIN}"
            EXPLORER_API_HOSTS="explorer-api.${DOMAIN}, prod-explorer-api.${DOMAIN}, prod.explorer-api.${DOMAIN}"
            EXPLORER_RPC_HOSTS="explorer-rpc.${DOMAIN}, prod-explorer-rpc.${DOMAIN}, prod.explorer-rpc.${DOMAIN}"
            EOF
            else
              cat > /etc/default/caddy-env <<EOF
            DOMAIN=${DOMAIN}
            EXPLORER_HOSTS="${DNS_PREFIX}explorer.${DOMAIN}"
            EXPLORER_API_HOSTS="${DNS_PREFIX}explorer-api.${DOMAIN}"
            EXPLORER_RPC_HOSTS="${DNS_PREFIX}explorer-rpc.${DOMAIN}"
            EOF
            fi
            systemctl restart caddy

            renderer=/opt/shielded-vote/current/scripts/render-explorer-dist.sh
            if [ ! -x "$renderer" ]; then
              renderer=/tmp/render-explorer-dist.sh
              curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/scripts/render-explorer-dist.sh" -o "$renderer"
              chmod +x "$renderer"
            fi
            "$renderer"

            # Run reset-archive: wipe state, download genesis, configure peering
            # with primary, start svoted in archive mode (pruning=nothing).
            export GENESIS_URL="${DO_SPACES_BASE}/${GENESIS_KEY}"
            export PRIMARY_REST_URL="${PRIMARY_REST_URL}"
            export HOME_DIR=/opt/shielded-vote/.svoted
            export MONIKER=archive

            curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/scripts/reset-archive.sh" -o /tmp/reset-archive.sh
            bash /tmp/reset-archive.sh
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

      - name: Verify archive health
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EXPLORER_HOST || vars.EXPLORER_HOST || format('{0}explorer.{1}', needs.resolve-environment.outputs.dns_prefix, secrets.DOMAIN) }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            for i in $(seq 1 20); do
              if curl -sf http://localhost:1317/cosmos/base/tendermint/v1beta1/blocks/latest > /dev/null 2>&1; then
                echo "Archive REST API healthy."
                exit 0
              fi
              echo "Waiting for archive REST API... ($i/20)"
              sleep 15
            done
            echo "ERROR: Archive REST API not healthy."
            exit 1

      - name: Publish initial archive snapshot
        uses: appleboy/ssh-action@v1.0.3
        timeout-minutes: 60
        with:
          host: ${{ secrets.EXPLORER_HOST || vars.EXPLORER_HOST || format('{0}explorer.{1}', needs.resolve-environment.outputs.dns_prefix, secrets.DOMAIN) }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: SNAPSHOT_HOST,VERIFY_PUBLIC_ENDPOINTS
          script: |
            set -euo pipefail

            set -a
            . /etc/default/archive-snapshot
            set +a

            systemctl stop archive-snapshot.timer || true
            for i in $(seq 1 20); do
              if /opt/shielded-vote/archive-snapshot-publish.sh; then
                systemctl enable --now archive-snapshot.timer
                echo "Initial archive snapshot published."
                break
              fi
              if [ "$i" = "20" ]; then
                echo "ERROR: Initial archive snapshot publish failed after retries."
                systemctl enable --now archive-snapshot.timer || true
                exit 1
              fi
              echo "Archive node is not ready to publish yet; retrying... ($i/20)"
              systemctl reset-failed archive-snapshot.service || true
              sleep 30
            done

            if [ "${VERIFY_PUBLIC_ENDPOINTS}" = "false" ]; then
              echo "Skipping archive HTTPS metadata checks before DNS cutover."
            else
              curl -fsS "https://${SNAPSHOT_HOST}/archive/latest.json" \
                | jq -e '.type == "archive" and (.roles | index("latest")) and (.roles | index("archive"))' > /dev/null
              curl -fsS "https://${SNAPSHOT_HOST}/archive/snapshots.json" \
                | jq -e 'length == 1 and .[0].type == "archive"' > /dev/null
              echo "Archive snapshot metadata healthy."
            fi

  verify:
    name: Post-reset verification
    if: ${{ always() && needs.reset-archive.result == 'success' && needs.reset-snapshot.result == 'success' && vars.VERIFY_PUBLIC_ENDPOINTS != 'false' }}
    runs-on: ubuntu-latest
    needs: [resolve-environment, reset-archive, reset-snapshot]
    environment: ${{ inputs.target_environment }}
    env:
      DNS_PREFIX: ${{ needs.resolve-environment.outputs.dns_prefix }}
      HAS_SECONDARY: ${{ needs.resolve-environment.outputs.has_secondary }}
      DOMAIN: ${{ secrets.DOMAIN }}
      PRIMARY_REST_URL: ${{ vars.PRIMARY_REST_URL || format('https://{0}vote-chain-primary.{1}', needs.resolve-environment.outputs.dns_prefix, secrets.DOMAIN) }}
      SECONDARY_REST_URL: ${{ vars.SECONDARY_REST_URL || format('https://{0}vote-chain-secondary.{1}', needs.resolve-environment.outputs.dns_prefix, secrets.DOMAIN) }}
      EXPLORER_API_BASE_URL: ${{ vars.EXPLORER_API_BASE_URL || format('https://{0}explorer-api.{1}', needs.resolve-environment.outputs.dns_prefix, secrets.DOMAIN) }}
      SNAPSHOT_BASE_URL: ${{ vars.SNAPSHOT_BASE_URL || format('https://{0}', vars.SNAPSHOT_PUBLIC_HOST || format('{0}snapshots.{1}', needs.resolve-environment.outputs.dns_prefix, secrets.DOMAIN)) }}
    steps:
      - name: Check fleet endpoints
        run: |
          FAILED=0
          VALIDATOR_URLS=("${PRIMARY_REST_URL%/}/shielded-vote/v1/rounds")
          if [ "${HAS_SECONDARY}" != "false" ]; then
            VALIDATOR_URLS+=("${SECONDARY_REST_URL%/}/shielded-vote/v1/rounds")
          fi
          for URL in "${VALIDATOR_URLS[@]}"; do
            for i in $(seq 1 10); do
              STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "$URL" || echo "000")
              if [ "$STATUS" = "200" ]; then
                echo "[OK] ${URL} healthy"
                break
              fi
              if [ "$i" -eq 10 ]; then
                echo "[FAIL] ${URL} not healthy (HTTP ${STATUS})"
                FAILED=1
              fi
              sleep 10
            done
          done
          # Explorer archive exposes the Cosmos LCD at explorer-api.<domain>.
          ARCHIVE_URL="${EXPLORER_API_BASE_URL%/}/cosmos/base/tendermint/v1beta1/blocks/latest"
          for i in $(seq 1 10); do
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "$ARCHIVE_URL" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "[OK] explorer archive healthy"
              break
            fi
            if [ "$i" -eq 10 ]; then
              echo "[FAIL] explorer archive not healthy (HTTP ${STATUS})"
              FAILED=1
            fi
            sleep 10
          done
          SNAPSHOT_BASE_URL="${SNAPSHOT_BASE_URL%/}"
          SNAPSHOT_URL="${SNAPSHOT_BASE_URL}/"
          for i in $(seq 1 10); do
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "$SNAPSHOT_URL" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "[OK] snapshot frontend healthy"
              break
            fi
            if [ "$i" -eq 10 ]; then
              echo "[FAIL] snapshot frontend not healthy (HTTP ${STATUS})"
              FAILED=1
            fi
            sleep 10
          done
          for METADATA_PATH in /daily.json /latest.json /snapshots.json /archive/latest.json; do
            URL="${SNAPSHOT_BASE_URL}${METADATA_PATH}"
            if curl -fsS "$URL" | jq empty > /dev/null; then
              echo "[OK] snapshot metadata ${METADATA_PATH}"
            else
              echo "[FAIL] snapshot metadata ${METADATA_PATH}"
              FAILED=1
            fi
          done
          exit $FAILED

  notify-slack:
    name: Slack Notification
    if: ${{ always() && contains(join(needs.*.result, ','), 'failure') }}
    needs: [quiesce-snapshot, quiesce-archive, reset-primary, upload-genesis, fund-secondary, reset-snapshot, reset-secondary, reset-archive, verify]
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment }}
    steps:
      - name: Notify Slack on failure
        uses: slackapi/slack-github-action@v2.1.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "SDK Chain Reset failed",
              "blocks": [
                {
                  "type": "header",
                  "text": { "type": "plain_text", "text": "SDK Chain Reset Failed", "emoji": true }
                },
                {
                  "type": "section",
                  "fields": [
                    { "type": "mrkdwn", "text": "*Workflow:*\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Reset SDK Chain>" },
                    { "type": "mrkdwn", "text": "*Tag:*\n`${{ env.TAG }}`" }
                  ]
                },
                {
                  "type": "section",
                  "text": { "type": "mrkdwn", "text": "*Job Results:*\nQuiesce Snapshot: `${{ needs.quiesce-snapshot.result }}` | Quiesce Archive: `${{ needs.quiesce-archive.result }}` | Reset Primary: `${{ needs.reset-primary.result }}` | Upload Genesis: `${{ needs.upload-genesis.result }}` | Fund Secondary: `${{ needs.fund-secondary.result }}` | Reset Snapshot: `${{ needs.reset-snapshot.result }}` | Reset Secondary: `${{ needs.reset-secondary.result }}` | Reset Archive: `${{ needs.reset-archive.result }}` | Verify: `${{ needs.verify.result }}`" }
                }
              ]
            }

  record-sentry-deploy:
    name: Record Sentry reset deploy
    if: ${{ always() && needs.verify.result == 'success' }}
    needs: [resolve-environment, verify]
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment }}
    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ENVIRONMENT: ${{ inputs.target_environment }}
    steps:
      - name: Record deploy marker
        run: |
          set -euo pipefail
          if [ -z "${SENTRY_AUTH_TOKEN:-}" ]; then
            echo "SENTRY_AUTH_TOKEN is not configured; skipping Sentry deploy marker."
            exit 0
          fi
          curl -sL https://sentry.io/get-cli/ | bash
          sentry-cli releases new --org valar-group --project svote-helper-vm "${TAG}" || true
          sentry-cli deploys new \
            --org valar-group \
            --project svote-helper-vm \
            --release "${TAG}" \
            -e "${SENTRY_ENVIRONMENT}"
