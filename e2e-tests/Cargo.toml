[package]
name = "e2e-tests"
version = "0.1.0"
edition = "2021"
description = "Rust E2E API tests for Shielded-Vote voting flow (replaces TypeScript suite)"

[dependencies]
# Keep the independent E2E graph on the upstream backend.
shielded-vote-circuits = { path = "../circuits", default-features = false, features = ["upstream"] }

orchard = { version = "0.15", features = ["unstable-voting-circuits"] }
voting-circuits = { version = "=0.12.0-rc.1", default-features = false, features = ["lrz"] }
vote-commitment-tree = { version = "=0.6.0", default-features = false, features = ["lrz"] }
vote-commitment-tree-client = { version = "=0.8.0", default-features = false, features = ["http", "lrz"] }
zcash_voting = { version = "=3.1.0-rc.13", default-features = false, features = ["lrz"] }

# HTTP and JSON
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Encoding
base64 = "0.22"
hex = "0.4"

# Round ID derivation (Poseidon hash)
halo2_gadgets = "=0.5.0"

# Blake2b (used by the voter throughput fixture)
blake2b_simd = "1"

# ElGamal on Pallas
pasta_curves = "0.5"
ff = "0.13"
group = "0.13"

# ECIES encryption (matching Go's sdk/crypto/ecies)
sha2 = "0.10"
chacha20poly1305 = "0.10"

# RNG
rand = "0.8"
rand_core = "0.6"

# Delegation setup (Merkle tree)
incrementalmerkletree = "0.8"

[dev-dependencies]
rand = "0.8"
rand_chacha = "0.3"

# Temporary until the coordinated 50-proposal wallet release is tagged.
[patch.crates-io]
vote-commitment-tree = { git = "https://github.com/valargroup/zcash_voting", rev = "0d209d4c1be59a21f014d21dfc71634a0d942c51" }
vote-commitment-tree-client = { git = "https://github.com/valargroup/zcash_voting", rev = "0d209d4c1be59a21f014d21dfc71634a0d942c51" }
zcash_voting = { git = "https://github.com/valargroup/zcash_voting", rev = "0d209d4c1be59a21f014d21dfc71634a0d942c51" }

[workspace]
