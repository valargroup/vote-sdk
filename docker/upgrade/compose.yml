x-node: &node
  image: ${UPGRADE_IMAGE:-svote-upgrade-systemd:local}
  platform: ${UPGRADE_PLATFORM:-linux/arm64}
  privileged: true
  cgroup: host
  tmpfs: [/run, /run/lock]
  volumes:
    - /sys/fs/cgroup:/sys/fs/cgroup:rw
    - ${UPGRADE_REPO:?}:/sdk:ro
    - ${UPGRADE_INFRA:?}:/infra:ro
    - ${UPGRADE_ARTIFACTS:?}:/artifacts:ro
  networks: [localnet]
services:
  primary:
    <<: *node
    hostname: primary
  secondary:
    <<: *node
    hostname: secondary
  observer:
    <<: *node
    hostname: observer
  fresh:
    <<: *node
    hostname: fresh
  joiner:
    <<: *node
    hostname: joiner
  artifacts:
    image: ${UPGRADE_IMAGE:-svote-upgrade-systemd:local}
    platform: ${UPGRADE_PLATFORM:-linux/arm64}
    command: [python3, -m, http.server, '8080', --directory, /artifacts]
    volumes:
      - ${UPGRADE_ARTIFACTS:?}:/artifacts:ro
    networks: [localnet]
networks:
  localnet:
    internal: true
