# Deploy a tagged shielded-vote release to the selected fleet.
# Manual by default; release tags only publish artifacts.

name: Deploy SDK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to deploy (e.g. v1.2.3). Must already exist in DO Spaces."
        type: string
        required: true
      sync_cosmovisor_runtime:
        description: "If true, atomically sync /opt/shielded-vote/current/bin/svoted into Cosmovisor runtime before restart."
        type: boolean
        default: false
        required: false
      target_environment:
        description: "GitHub Environment to read deploy secrets and variables from."
        type: choice
        options:
          - staging
          - production
        default: staging
        required: true
  workflow_call:
    inputs:
      tag:
        description: "Release tag to deploy (e.g. v1.2.3). Must already exist in DO Spaces."
        type: string
        required: true
      sync_cosmovisor_runtime:
        description: "If true, atomically sync /opt/shielded-vote/current/bin/svoted into Cosmovisor runtime before restart."
        type: boolean
        default: false
        required: false
      target_environment:
        description: "GitHub Environment to read deploy secrets and variables from."
        type: string
        default: staging
        required: false

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag }}

jobs:
  resolve-environment:
    name: Resolve environment settings
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment }}
    outputs:
      chain_id: ${{ steps.resolve.outputs.chain_id }}
      dns_prefix: ${{ steps.resolve.outputs.dns_prefix }}
      has_secondary: ${{ steps.resolve.outputs.has_secondary }}
      release_base_url: ${{ steps.resolve.outputs.release_base_url }}
      voting_config_url: ${{ steps.resolve.outputs.voting_config_url }}
    steps:
      - name: Resolve GitHub Environment variables
        id: resolve
        env:
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
          CHAIN_ID: ${{ vars.CHAIN_ID }}
          DNS_PREFIX: ${{ vars.DNS_PREFIX }}
          HAS_SECONDARY: ${{ vars.HAS_SECONDARY }}
          DO_SPACES_BUCKET: ${{ vars.DO_SPACES_BUCKET }}
          DO_SPACES_REGION: ${{ vars.DO_SPACES_REGION }}
          DO_SPACES_BASE: ${{ vars.DO_SPACES_BASE }}
          RELEASE_BASE_URL: ${{ vars.RELEASE_BASE_URL }}
          VOTING_CONFIG_URL: ${{ vars.VOTING_CONFIG_URL }}
        run: |
          set -euo pipefail
          if [ "$TARGET_ENVIRONMENT" = "production" ]; then
            default_chain_id="zvote-1"
            default_dns_prefix="prod."
            default_has_secondary="false"
            default_voting_config_url="https://raw.githubusercontent.com/valargroup/token-holder-voting-config/main/prod/"
          else
            default_chain_id="svote-1"
            default_dns_prefix="stage."
            default_has_secondary="true"
            default_voting_config_url="https://raw.githubusercontent.com/valargroup/token-holder-voting-config/main/stage/"
          fi
          do_spaces_bucket="${DO_SPACES_BUCKET:-shielded-vote}"
          do_spaces_region="${DO_SPACES_REGION:-nyc3}"
          do_spaces_base="${DO_SPACES_BASE:-https://${do_spaces_bucket}.${do_spaces_region}.digitaloceanspaces.com}"
          release_base_url="${RELEASE_BASE_URL:-${do_spaces_base}/binaries/vote-sdk}"
          voting_config_url="${VOTING_CONFIG_URL:-$default_voting_config_url}"
          {
            echo "chain_id=${CHAIN_ID:-$default_chain_id}"
            echo "dns_prefix=${DNS_PREFIX:-$default_dns_prefix}"
            echo "has_secondary=${HAS_SECONDARY:-$default_has_secondary}"
            echo "release_base_url=${release_base_url}"
            echo "voting_config_url=${voting_config_url}"
          } >> "$GITHUB_OUTPUT"

  deploy-primary:
    name: Deploy primary
    runs-on: ubuntu-latest
    needs: resolve-environment
    environment: ${{ inputs.target_environment }}
    env:
      RELEASE_BASE_URL: ${{ needs.resolve-environment.outputs.release_base_url }}
      DNS_PREFIX: ${{ needs.resolve-environment.outputs.dns_prefix }}
      SENTRY_ENVIRONMENT: ${{ inputs.target_environment }}
      SVOTE_CONFIG_URL: ${{ needs.resolve-environment.outputs.voting_config_url }}
      SYNC_COSMOVISOR_RUNTIME: ${{ inputs.sync_cosmovisor_runtime && 'true' || 'false' }}
    steps:
      - name: Deploy to primary Droplet
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PRIMARY_HOST || vars.PRIMARY_HOST || format('{0}vote-chain-primary.{1}', needs.resolve-environment.outputs.dns_prefix, secrets.DOMAIN) }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: SENTRY_DSN,SENTRY_ENVIRONMENT,SVOTE_CONFIG_PR_GITHUB_TOKEN,SVOTE_CONFIG_URL,DNS_PREFIX,DOMAIN,SYNC_COSMOVISOR_RUNTIME
          script: |
            sed -i '/^SENTRY_DSN=/d' /etc/default/svoted
            echo "SENTRY_DSN=$SENTRY_DSN" >> /etc/default/svoted
            sed -i '/^SENTRY_ENVIRONMENT=/d' /etc/default/svoted
            echo "SENTRY_ENVIRONMENT=$SENTRY_ENVIRONMENT" >> /etc/default/svoted
            sed -i '/^SVOTE_CONFIG_URL=/d' /etc/default/svoted
            echo "SVOTE_CONFIG_URL=$SVOTE_CONFIG_URL" >> /etc/default/svoted
            sed -i '/^SVOTE_CONFIG_PR_GITHUB_TOKEN=/d' /etc/default/svoted
            if [ -n "${SVOTE_CONFIG_PR_GITHUB_TOKEN:-}" ]; then
              echo "SVOTE_CONFIG_PR_GITHUB_TOKEN=$SVOTE_CONFIG_PR_GITHUB_TOKEN" >> /etc/default/svoted
            fi
            mkdir -p /etc/systemd/system/svoted.service.d
            printf '[Service]\nEnvironmentFile=-/etc/default/svoted\n' \
              > /etc/systemd/system/svoted.service.d/10-envfile.conf
            systemctl daemon-reload
            if [ "$SENTRY_ENVIRONMENT" = "production" ]; then
              cat > /etc/default/caddy-env <<EOF
            DOMAIN=${DOMAIN}
            PRIMARY_HOSTS="vote-chain-primary.${DOMAIN}, prod-vote-chain-primary.${DOMAIN}, prod.vote-chain-primary.${DOMAIN}"
            RPC_PRIMARY_HOSTS="vote-rpc-primary.${DOMAIN}, prod-vote-rpc-primary.${DOMAIN}, prod.vote-rpc-primary.${DOMAIN}"
            SVOTE_HOSTS="svote.${DOMAIN}, prod.svote.${DOMAIN}"
            EOF
            else
              cat > /etc/default/caddy-env <<EOF
            DOMAIN=${DOMAIN}
            PRIMARY_HOSTS="${DNS_PREFIX}vote-chain-primary.${DOMAIN}"
            RPC_PRIMARY_HOSTS="${DNS_PREFIX}vote-rpc-primary.${DOMAIN}"
            SVOTE_HOSTS="${DNS_PREFIX}svote.${DOMAIN}"
            EOF
            fi
            systemctl restart caddy
            if [ -f /opt/shielded-vote/.svoted/config/app.toml ]; then
              sed -i.bak "s#^config_url = .*\$#config_url = \"${SVOTE_CONFIG_URL}\"#" /opt/shielded-vote/.svoted/config/app.toml
              rm -f /opt/shielded-vote/.svoted/config/app.toml.bak
            fi
            /opt/shielded-vote/install-release.sh --tag "${{ env.TAG }}" --base "${{ env.RELEASE_BASE_URL }}"
            helper=/tmp/ensure-cosmovisor-runtime.sh
            curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/scripts/ci/ensure_cosmovisor_runtime.sh" -o "$helper"
            chmod +x "$helper"
            SYNC_COSMOVISOR_RUNTIME="${SYNC_COSMOVISOR_RUNTIME}" \
              ENSURE_COSMOVISOR_MODE="true" \
              "$helper"
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SVOTE_CONFIG_PR_GITHUB_TOKEN: ${{ secrets.CONFIG_PR_GITHUB_TOKEN }}
          DOMAIN: ${{ secrets.DOMAIN }}

      - name: Verify primary health
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PRIMARY_HOST || vars.PRIMARY_HOST || format('{0}vote-chain-primary.{1}', needs.resolve-environment.outputs.dns_prefix, secrets.DOMAIN) }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            for i in $(seq 1 30); do
              if curl -sf http://localhost:1317/shielded-vote/v1/rounds > /dev/null 2>&1; then
                echo "Primary REST API healthy."
                exit 0
              fi
              echo "Waiting for primary REST API... ($i/30)"
              sleep 10
            done
            echo "ERROR: Primary REST API not healthy after 5 minutes."
            exit 1

  deploy-secondary:
    name: Deploy secondary
    runs-on: ubuntu-latest
    needs: resolve-environment
    if: ${{ needs.resolve-environment.outputs.has_secondary != 'false' }}
    environment: ${{ inputs.target_environment }}
    env:
      RELEASE_BASE_URL: ${{ needs.resolve-environment.outputs.release_base_url }}
      SENTRY_ENVIRONMENT: ${{ inputs.target_environment }}
      SYNC_COSMOVISOR_RUNTIME: ${{ inputs.sync_cosmovisor_runtime && 'true' || 'false' }}
    steps:
      - name: Deploy to secondary Droplet
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SECONDARY_HOST || vars.SECONDARY_HOST || format('{0}vote-chain-secondary.{1}', needs.resolve-environment.outputs.dns_prefix, secrets.DOMAIN) }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: SENTRY_DSN,SENTRY_ENVIRONMENT,SYNC_COSMOVISOR_RUNTIME
          script: |
            sed -i '/^SENTRY_DSN=/d' /etc/default/svoted
            echo "SENTRY_DSN=$SENTRY_DSN" >> /etc/default/svoted
            sed -i '/^SENTRY_ENVIRONMENT=/d' /etc/default/svoted
            echo "SENTRY_ENVIRONMENT=$SENTRY_ENVIRONMENT" >> /etc/default/svoted
            mkdir -p /etc/systemd/system/svoted.service.d
            printf '[Service]\nEnvironmentFile=-/etc/default/svoted\n' \
              > /etc/systemd/system/svoted.service.d/10-envfile.conf
            systemctl daemon-reload
            /opt/shielded-vote/install-release.sh --tag "${{ env.TAG }}" --base "${{ env.RELEASE_BASE_URL }}"
            helper=/tmp/ensure-cosmovisor-runtime.sh
            curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/scripts/ci/ensure_cosmovisor_runtime.sh" -o "$helper"
            chmod +x "$helper"
            SYNC_COSMOVISOR_RUNTIME="${SYNC_COSMOVISOR_RUNTIME}" \
              ENSURE_COSMOVISOR_MODE="true" \
              "$helper"
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

      - name: Verify secondary health
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SECONDARY_HOST || vars.SECONDARY_HOST || format('{0}vote-chain-secondary.{1}', needs.resolve-environment.outputs.dns_prefix, secrets.DOMAIN) }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            for i in $(seq 1 30); do
              if curl -sf http://localhost:1317/shielded-vote/v1/rounds > /dev/null 2>&1; then
                echo "Secondary REST API healthy."
                exit 0
              fi
              echo "Waiting for secondary REST API... ($i/30)"
              sleep 10
            done
            echo "ERROR: Secondary REST API not healthy after 5 minutes."
            exit 1

  deploy-explorer:
    name: Deploy explorer
    runs-on: ubuntu-latest
    needs: resolve-environment
    environment: ${{ inputs.target_environment }}
    env:
      CHAIN_ID: ${{ needs.resolve-environment.outputs.chain_id }}
      DNS_PREFIX: ${{ needs.resolve-environment.outputs.dns_prefix }}
      RELEASE_BASE_URL: ${{ needs.resolve-environment.outputs.release_base_url }}
      SENTRY_ENVIRONMENT: ${{ inputs.target_environment }}
      SYNC_COSMOVISOR_RUNTIME: ${{ inputs.sync_cosmovisor_runtime && 'true' || 'false' }}
    steps:
      - name: Deploy to explorer Droplet
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EXPLORER_HOST || vars.EXPLORER_HOST || format('{0}explorer.{1}', needs.resolve-environment.outputs.dns_prefix, secrets.DOMAIN) }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: SENTRY_DSN,SENTRY_ENVIRONMENT,TAG,CHAIN_ID,DNS_PREFIX,DOMAIN,RELEASE_BASE_URL,SYNC_COSMOVISOR_RUNTIME
          script: |
            set -euo pipefail
            sed -i '/^SENTRY_DSN=/d' /etc/default/svoted
            echo "SENTRY_DSN=$SENTRY_DSN" >> /etc/default/svoted
            sed -i '/^SENTRY_ENVIRONMENT=/d' /etc/default/svoted
            echo "SENTRY_ENVIRONMENT=$SENTRY_ENVIRONMENT" >> /etc/default/svoted
            mkdir -p /etc/systemd/system/svoted.service.d
            printf '[Service]\nEnvironmentFile=-/etc/default/svoted\n' \
              > /etc/systemd/system/svoted.service.d/10-envfile.conf
            systemctl daemon-reload

            if [ "$SENTRY_ENVIRONMENT" = "production" ]; then
              cat > /etc/default/caddy-env <<EOF
            DOMAIN=${DOMAIN}
            EXPLORER_HOSTS="explorer.${DOMAIN}, prod-explorer.${DOMAIN}, prod.explorer.${DOMAIN}"
            EXPLORER_API_HOSTS="explorer-api.${DOMAIN}, prod-explorer-api.${DOMAIN}, prod.explorer-api.${DOMAIN}"
            EXPLORER_RPC_HOSTS="explorer-rpc.${DOMAIN}, prod-explorer-rpc.${DOMAIN}, prod.explorer-rpc.${DOMAIN}"
            EOF
            else
              cat > /etc/default/caddy-env <<EOF
            DOMAIN=${DOMAIN}
            EXPLORER_HOSTS="${DNS_PREFIX}explorer.${DOMAIN}"
            EXPLORER_API_HOSTS="${DNS_PREFIX}explorer-api.${DOMAIN}"
            EXPLORER_RPC_HOSTS="${DNS_PREFIX}explorer-rpc.${DOMAIN}"
            EOF
            fi
            systemctl restart caddy

            # On first deploy (before sdk-chain-reset.yml runs reset-archive),
            # .svoted/config/genesis.json doesn't exist yet — svoted can't
            # start, so skip the restart. Subsequent deploys restart normally
            # to pick up the new binary.
            if [ -f /opt/shielded-vote/.svoted/config/genesis.json ]; then
              /opt/shielded-vote/install-release.sh --tag "${TAG}" --base "${RELEASE_BASE_URL}"
              helper=/tmp/ensure-cosmovisor-runtime.sh
              curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/scripts/ci/ensure_cosmovisor_runtime.sh" -o "$helper"
              chmod +x "$helper"
              SYNC_COSMOVISOR_RUNTIME="${SYNC_COSMOVISOR_RUNTIME}" \
                ENSURE_COSMOVISOR_MODE="true" \
                "$helper"
            else
              /opt/shielded-vote/install-release.sh --tag "${TAG}" --base "${RELEASE_BASE_URL}" --skip-restart
              echo "NOTE: archive has no genesis yet. Run sdk-chain-reset.yml with this tag to initialize it."
            fi

            renderer=/opt/shielded-vote/current/scripts/render-explorer-dist.sh
            if [ ! -x "$renderer" ]; then
              renderer=/tmp/render-explorer-dist.sh
              curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/scripts/render-explorer-dist.sh" -o "$renderer"
              chmod +x "$renderer"
            fi
            "$renderer"
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          DOMAIN: ${{ secrets.DOMAIN }}

      - name: Verify explorer frontend healthy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EXPLORER_HOST || vars.EXPLORER_HOST || format('{0}explorer.{1}', needs.resolve-environment.outputs.dns_prefix, secrets.DOMAIN) }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Caddy serves the static explorer dist regardless of archive
            # state, so this check only verifies the frontend is reachable.
            # Archive health is verified in sdk-chain-reset.yml.
            for i in $(seq 1 15); do
              if curl -sf http://localhost/ > /dev/null 2>&1; then
                echo "Explorer frontend healthy."
                exit 0
              fi
              echo "Waiting for explorer frontend... ($i/15)"
              sleep 10
            done
            echo "ERROR: Explorer frontend not healthy after 2.5 minutes."
            exit 1

  deploy-snapshot:
    name: Deploy snapshot node
    runs-on: ubuntu-latest
    needs: resolve-environment
    environment: ${{ inputs.target_environment }}
    env:
      RELEASE_BASE_URL: ${{ needs.resolve-environment.outputs.release_base_url }}
      SENTRY_ENVIRONMENT: ${{ inputs.target_environment }}
      SYNC_COSMOVISOR_RUNTIME: ${{ inputs.sync_cosmovisor_runtime && 'true' || 'false' }}
    steps:
      - name: Deploy to snapshot Droplet
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SNAPSHOT_HOST || vars.SNAPSHOT_HOST || format('{0}snapshots.{1}', needs.resolve-environment.outputs.dns_prefix, secrets.DOMAIN) }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: SENTRY_DSN,SENTRY_ENVIRONMENT,TAG,RELEASE_BASE_URL,SYNC_COSMOVISOR_RUNTIME
          script: |
            set -euo pipefail
            sed -i '/^SENTRY_DSN=/d' /etc/default/svoted
            echo "SENTRY_DSN=$SENTRY_DSN" >> /etc/default/svoted
            sed -i '/^SENTRY_ENVIRONMENT=/d' /etc/default/svoted
            echo "SENTRY_ENVIRONMENT=$SENTRY_ENVIRONMENT" >> /etc/default/svoted
            mkdir -p /etc/systemd/system/svoted.service.d
            printf '[Service]\nEnvironmentFile=-/etc/default/svoted\n' \
              > /etc/systemd/system/svoted.service.d/10-envfile.conf
            systemctl daemon-reload

            # On first deploy (before sdk-chain-reset.yml runs reset-snapshot),
            # .svoted/config/genesis.json does not exist yet, so svoted cannot
            # start. Subsequent deploys restart normally to pick up the binary.
            if [ -f /opt/shielded-vote/.svoted/config/genesis.json ]; then
              /opt/shielded-vote/install-release.sh --tag "${TAG}" --base "${RELEASE_BASE_URL}"
              helper=/tmp/ensure-cosmovisor-runtime.sh
              curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/scripts/ci/ensure_cosmovisor_runtime.sh" -o "$helper"
              chmod +x "$helper"
              SYNC_COSMOVISOR_RUNTIME="${SYNC_COSMOVISOR_RUNTIME}" \
                ENSURE_COSMOVISOR_MODE="true" \
                "$helper"
            else
              /opt/shielded-vote/install-release.sh --tag "${TAG}" --base "${RELEASE_BASE_URL}" --skip-restart
              echo "NOTE: snapshot node has no genesis yet. Run sdk-chain-reset.yml with this tag to initialize it."
            fi
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

      - name: Verify snapshot frontend healthy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SNAPSHOT_HOST || vars.SNAPSHOT_HOST || format('{0}snapshots.{1}', needs.resolve-environment.outputs.dns_prefix, secrets.DOMAIN) }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: SNAPSHOT_HOST
          script: |
            for i in $(seq 1 15); do
              if curl -sf -H "Host: ${SNAPSHOT_HOST}" http://localhost/ > /dev/null 2>&1; then
                echo "Snapshot frontend healthy."
                exit 0
              fi
              echo "Waiting for snapshot frontend... ($i/15)"
              sleep 10
            done
            echo "ERROR: Snapshot frontend not healthy after 2.5 minutes."
            exit 1
        env:
          SNAPSHOT_HOST: ${{ vars.SNAPSHOT_PUBLIC_HOST || format('{0}snapshots.{1}', needs.resolve-environment.outputs.dns_prefix, secrets.DOMAIN) }}

  notify-slack:
    name: Slack Notification
    if: ${{ always() && contains(join(needs.*.result, ','), 'failure') }}
    needs: [deploy-primary, deploy-secondary, deploy-explorer, deploy-snapshot]
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment }}
    steps:
      - name: Notify Slack on failure
        uses: slackapi/slack-github-action@v2.1.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "SDK Deploy failed",
              "blocks": [
                {
                  "type": "header",
                  "text": { "type": "plain_text", "text": "SDK Deploy Failed", "emoji": true }
                },
                {
                  "type": "section",
                  "fields": [
                    { "type": "mrkdwn", "text": "*Workflow:*\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Deploy SDK>" },
                    { "type": "mrkdwn", "text": "*Tag:*\n`${{ env.TAG }}`" }
                  ]
                },
                {
                  "type": "section",
                  "text": { "type": "mrkdwn", "text": "*Job Results:*\nPrimary: `${{ needs.deploy-primary.result }}` | Secondary: `${{ needs.deploy-secondary.result }}` | Explorer: `${{ needs.deploy-explorer.result }}` | Snapshot: `${{ needs.deploy-snapshot.result }}`" }
                }
              ]
            }

  record-sentry-deploy:
    name: Record Sentry deploy
    if: |
      always() &&
      needs.deploy-primary.result == 'success' &&
      (needs.deploy-secondary.result == 'success' || needs.deploy-secondary.result == 'skipped') &&
      needs.deploy-explorer.result == 'success' &&
      needs.deploy-snapshot.result == 'success'
    needs: [resolve-environment, deploy-primary, deploy-secondary, deploy-explorer, deploy-snapshot]
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment }}
    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ENVIRONMENT: ${{ inputs.target_environment }}
    steps:
      - name: Record deploy marker
        run: |
          set -euo pipefail
          if [ -z "${SENTRY_AUTH_TOKEN:-}" ]; then
            echo "SENTRY_AUTH_TOKEN is not configured; skipping Sentry deploy marker."
            exit 0
          fi
          curl -sL https://sentry.io/get-cli/ | bash
          sentry-cli releases new --org valar-group --project svote-helper-vm "${TAG}" || true
          sentry-cli deploys new \
            --org valar-group \
            --project svote-helper-vm \
            --release "${TAG}" \
            -e "${SENTRY_ENVIRONMENT}"
