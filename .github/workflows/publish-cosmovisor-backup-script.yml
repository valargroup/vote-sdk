name: Publish Cosmovisor backup maintenance script

on:
  workflow_dispatch:
    inputs:
      script_version:
        description: Immutable operator-script version, for example v1
        required: true
        default: v1

permissions:
  contents: read

jobs:
  publish:
    name: Publish immutable backup maintenance script
    runs-on: ubuntu-latest
    concurrency:
      group: publish-cosmovisor-backup-script-${{ vars.DO_SPACES_BUCKET || 'shielded-vote' }}-${{ inputs.script_version }}
      cancel-in-progress: false
    env:
      DO_ACCESS_KEY: ${{ secrets.DO_ACCESS_KEY }}
      DO_SECRET_KEY: ${{ secrets.DO_SECRET_KEY }}
      DO_SPACES_BUCKET: ${{ vars.DO_SPACES_BUCKET }}
      DO_SPACES_REGION: ${{ vars.DO_SPACES_REGION }}
      DO_SPACES_BASE: ${{ vars.DO_SPACES_BASE }}
      SCRIPT_VERSION: ${{ inputs.script_version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Render and test scripts
        run: |
          set -euo pipefail
          printf '%s\n' "$SCRIPT_VERSION" | grep -Eq '^v[1-9][0-9]*$'
          DO_SPACES_BUCKET="${DO_SPACES_BUCKET:-shielded-vote}"
          DO_SPACES_REGION="${DO_SPACES_REGION:-nyc3}"
          DO_SPACES_BASE="${DO_SPACES_BASE:-https://${DO_SPACES_BUCKET}.${DO_SPACES_REGION}.digitaloceanspaces.com}"
          output_dir="${RUNNER_TEMP}/cosmovisor-backup-script"
          mkdir -p "$output_dir"

          scripts/render-disable-cosmovisor-backups.sh \
            "$SCRIPT_VERSION" \
            "$DO_SPACES_BASE" \
            > "${output_dir}/disable-cosmovisor-backups.sh"
          cp scripts/_chain_upgrade_common.sh "$output_dir/"
          chmod +x "${output_dir}/"*.sh
          bash -n "${output_dir}/"*.sh scripts/test_disable_cosmovisor_backups.sh
          bash scripts/test_disable_cosmovisor_backups.sh
          "${output_dir}/disable-cosmovisor-backups.sh" --help >/dev/null

          (
            cd "$output_dir"
            sha256sum disable-cosmovisor-backups.sh > disable-cosmovisor-backups.sh.sha256
            sha256sum _chain_upgrade_common.sh > _chain_upgrade_common.sh.sha256
          )
          echo "SCRIPT_OUTPUT_DIR=${output_dir}" >> "$GITHUB_ENV"

      - name: Upload immutable files to DigitalOcean Spaces
        run: |
          set -euo pipefail
          DO_SPACES_BUCKET="${DO_SPACES_BUCKET:-shielded-vote}"
          DO_SPACES_REGION="${DO_SPACES_REGION:-nyc3}"
          DO_SPACES_BASE="${DO_SPACES_BASE:-https://${DO_SPACES_BUCKET}.${DO_SPACES_REGION}.digitaloceanspaces.com}"
          prefix="scripts/disable-cosmovisor-backups/${SCRIPT_VERSION}"
          pip install --quiet s3cmd
          umask 077
          cat > /tmp/do-spaces.s3cfg <<EOF
          [default]
          access_key = ${DO_ACCESS_KEY}
          secret_key = ${DO_SECRET_KEY}
          host_base = ${DO_SPACES_REGION}.digitaloceanspaces.com
          host_bucket = %(bucket)s.${DO_SPACES_REGION}.digitaloceanspaces.com
          bucket_location = ${DO_SPACES_REGION}
          use_https = True
          EOF
          trap 'rm -f /tmp/do-spaces.s3cfg' EXIT

          files=(
            _chain_upgrade_common.sh
            _chain_upgrade_common.sh.sha256
            disable-cosmovisor-backups.sh
            disable-cosmovisor-backups.sh.sha256
          )
          missing=()
          for file in "${files[@]}"; do
            object="s3://${DO_SPACES_BUCKET}/${prefix}/${file}"
            existing="${RUNNER_TEMP}/existing-${file}"
            if s3cmd -c /tmp/do-spaces.s3cfg info "$object" >/dev/null 2>&1; then
              s3cmd -c /tmp/do-spaces.s3cfg get --force "$object" "$existing"
              if cmp "${SCRIPT_OUTPUT_DIR}/${file}" "$existing"; then
                echo "Already published with identical bytes: ${DO_SPACES_BASE%/}/${prefix}/${file}"
                continue
              fi
              echo "ERROR: immutable script version already exists with different bytes: ${DO_SPACES_BASE%/}/${prefix}/${file}" >&2
              exit 1
            fi
            missing+=("$file")
          done

          # Publish the checksum-pinned helper before the entrypoint.
          for file in "${missing[@]}"; do
            s3cmd -c /tmp/do-spaces.s3cfg put -m text/plain --acl-public \
              "${SCRIPT_OUTPUT_DIR}/${file}" \
              "s3://${DO_SPACES_BUCKET}/${prefix}/${file}"
          done

      - name: Verify published bytes and checksums
        run: |
          set -euo pipefail
          DO_SPACES_BUCKET="${DO_SPACES_BUCKET:-shielded-vote}"
          DO_SPACES_REGION="${DO_SPACES_REGION:-nyc3}"
          DO_SPACES_BASE="${DO_SPACES_BASE:-https://${DO_SPACES_BUCKET}.${DO_SPACES_REGION}.digitaloceanspaces.com}"
          prefix="scripts/disable-cosmovisor-backups/${SCRIPT_VERSION}"
          verify_dir="${RUNNER_TEMP}/verify-cosmovisor-backup-script"
          mkdir -p "$verify_dir"

          for file in _chain_upgrade_common.sh _chain_upgrade_common.sh.sha256 disable-cosmovisor-backups.sh disable-cosmovisor-backups.sh.sha256; do
            curl -fsSL --retry 5 --retry-delay 2 \
              "${DO_SPACES_BASE%/}/${prefix}/${file}" \
              -o "${verify_dir}/${file}"
            cmp "${SCRIPT_OUTPUT_DIR}/${file}" "${verify_dir}/${file}"
          done
          (
            cd "$verify_dir"
            sha256sum --check _chain_upgrade_common.sh.sha256
            sha256sum --check disable-cosmovisor-backups.sh.sha256
          )
          chmod +x "${verify_dir}/disable-cosmovisor-backups.sh"
          "${verify_dir}/disable-cosmovisor-backups.sh" --help >/dev/null
          echo "Published script: ${DO_SPACES_BASE%/}/${prefix}/disable-cosmovisor-backups.sh"
          cat "${verify_dir}/disable-cosmovisor-backups.sh.sha256"
