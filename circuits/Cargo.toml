[package]
name = "shielded-vote-circuits"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
description = "Halo2 ZKP circuits and FFI verification for the Shielded-Vote chain"

[lib]
crate-type = ["staticlib", "lib"]

[features]
default = ["zakura"]
upstream = [
    "dep:lrz_zcash_protocol",
    "voting-crypto-deps/lrz-validator",
    "voting-circuits/lrz",
    "imt-tree/upstream",
    "vote-commitment-tree/lrz",
]
zakura = [
    "dep:zcash_protocol",
    "voting-crypto-deps/validator",
    "voting-circuits/default",
    "imt-tree/zakura",
    "vote-commitment-tree/zakura",
]

[dependencies]
voting-crypto-deps = { git = "https://github.com/valargroup/voting-circuits", rev = "35f0cd33cf419a89effa3246862ec82da20e7ee2", version = "=0.2.4", default-features = false }
vote-commitment-tree = { git = "https://github.com/valargroup/zcash_voting", rev = "463b5a35dd4043a5019b958cc5d644f95799b75f", version = "=0.6.3", default-features = false }
voting-circuits = { git = "https://github.com/valargroup/voting-circuits", rev = "35f0cd33cf419a89effa3246862ec82da20e7ee2", version = "=0.12.2", default-features = false }
imt-tree = { git = "https://github.com/valargroup/vote-nullifier-pir", rev = "f4a341a48b82de23febc7e865a1c0bbac3b95d1d", version = "=0.5.4", default-features = false }
incrementalmerkletree = "0.8"
nonempty = "0.11"
zcash_protocol = { package = "zakura-protocol", version = "=3.0.0", optional = true }
lrz_zcash_protocol = { package = "zcash_protocol", version = "0.11.0-pre.0", optional = true }
hex = "0.4"

[dev-dependencies]
blake2b_simd = "1"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace]
