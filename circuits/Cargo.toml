[package]
name = "shielded-vote-circuits"
version = "0.1.0"
edition = "2021"
description = "Halo2 ZKP circuits and FFI verification for the Shielded-Vote chain"

[lib]
crate-type = ["staticlib", "lib"]

[features]
default = ["zakura"]
upstream = [
    "voting-crypto-deps/lrz-validator",
    "voting-circuits/lrz",
    "imt-tree/upstream",
    "vote-commitment-tree/lrz",
    "dep:lrz_zcash_protocol",
]
zakura = [
    "voting-crypto-deps/validator",
    "voting-circuits/default",
    "imt-tree/zakura",
    "vote-commitment-tree/zakura",
    "dep:zcash_protocol",
]

[dependencies]
voting-crypto-deps = { version = "=0.5.0", default-features = false }
vote-commitment-tree = { version = "=0.9.0", default-features = false }
# 0.15.0 plus ZKP4 until the release that ships ZKP4 is out. The git source
# is in [patch.crates-io] below.
voting-circuits = { version = "=0.15.0", default-features = false }
imt-tree = { version = "=0.8.0", default-features = false }
nonempty = "0.11"
# Zakura publishes its protocol crate as `zakura-protocol`, with lib name
# `zcash_protocol`; `upstream` selects crates.io `zcash_protocol` (see lib.rs).
zcash_protocol = { version = "=5.4.0", package = "zakura-protocol", default-features = false, optional = true }
lrz_zcash_protocol = { version = "0.11", package = "zcash_protocol", optional = true }
hex = "0.4"
blake2b_simd = "1"

[dev-dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace]

# voting-circuits and voting-crypto-deps live in one repo and move together, so
# both come from the same rev. Drop this once voting-circuits releases ZKP4.
[patch.crates-io]
voting-circuits = { git = "https://github.com/valargroup/voting-circuits", rev = "aa3ba600ddcd58db23d1c4e9de8c3ed2e28cdb56" }
voting-crypto-deps = { git = "https://github.com/valargroup/voting-circuits", rev = "aa3ba600ddcd58db23d1c4e9de8c3ed2e28cdb56" }
