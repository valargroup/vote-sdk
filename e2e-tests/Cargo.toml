[package]
name = "e2e-tests"
version = "0.1.0"
edition = "2021"
description = "Rust E2E API tests for Shielded-Vote voting flow (replaces TypeScript suite)"

[dependencies]
# Same-repo path dep (circuits/ is a sibling directory)
shielded-vote-circuits = { path = "../circuits" }

orchard = { version = "=0.15.0", features = ["unstable-voting-circuits"] }
voting-circuits = "=0.9.0-rc.2"
vote-commitment-tree = "=0.3.2"
vote-commitment-tree-client = { version = "=0.5.2", features = ["http"] }
zcash_voting = "=1.0.0"

# HTTP and JSON
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Encoding
base64 = "0.22"
hex = "0.4"

# Round ID derivation (Poseidon hash)
halo2_gadgets = "=0.5.0"

# Blake2b (still used for sighash in e2e setup)
blake2b_simd = "1"

# ElGamal on Pallas
pasta_curves = "0.5"
ff = "0.13"
group = "0.13"

# ECIES encryption (matching Go's sdk/crypto/ecies)
sha2 = "0.10"
chacha20poly1305 = "0.10"

# RNG
rand = "0.8"
rand_core = "0.6"

# Delegation setup (Merkle tree)
incrementalmerkletree = "0.8"

[dev-dependencies]
rand = "0.8"
rand_chacha = "0.3"

[workspace]

[patch.crates-io]
vote-commitment-tree = { git = "https://github.com/valargroup/zcash_voting", rev = "a1ec065609e55c2d9b6314f5e1e1437956fa4570" }
vote-commitment-tree-client = { git = "https://github.com/valargroup/zcash_voting", rev = "a1ec065609e55c2d9b6314f5e1e1437956fa4570" }
zcash_voting = { git = "https://github.com/valargroup/zcash_voting", rev = "a1ec065609e55c2d9b6314f5e1e1437956fa4570" }

pczt = { git = "https://github.com/zcash/librustzcash", rev = "30bbc8990c3f7987868ea56fb483a7c11c56bad2" }
zcash_client_backend = { git = "https://github.com/zcash/librustzcash", rev = "30bbc8990c3f7987868ea56fb483a7c11c56bad2" }
zcash_client_sqlite = { git = "https://github.com/zcash/librustzcash", rev = "30bbc8990c3f7987868ea56fb483a7c11c56bad2" }
zcash_keys = { git = "https://github.com/zcash/librustzcash", rev = "30bbc8990c3f7987868ea56fb483a7c11c56bad2" }
zcash_primitives = { git = "https://github.com/zcash/librustzcash", rev = "30bbc8990c3f7987868ea56fb483a7c11c56bad2" }
zcash_protocol = { git = "https://github.com/zcash/librustzcash", rev = "30bbc8990c3f7987868ea56fb483a7c11c56bad2" }
