name: PR state compatibility

# Keep this on pull_request_target so a PR cannot rewrite its own validation.
on:
  pull_request_target:
    branches:
      - main
      - "v*.*.x"
    types: [opened, reopened, synchronize, edited, labeled, unlabeled, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-state-compatibility-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-labels:
    name: Validate state labels
    runs-on: ubuntu-latest
    env:
      PR_BASE_REF: ${{ github.base_ref }}
      PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
    steps:
      - name: Checkout trusted base validator
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - name: Validate state and backport labels
        run: |
          labels=()
          while IFS= read -r label; do
            labels+=("$label")
          done < <(jq -r '.[]' <<< "$PR_LABELS")
          scripts/validate-pr-state-labels.sh "${labels[@]}"
