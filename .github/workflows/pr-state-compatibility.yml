name: PR state compatibility

on:
  pull_request:
    branches:
      - main
      - "v*.*.x"
    types: [opened, reopened, synchronize, labeled, unlabeled, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-labels:
    name: Validate state labels
    runs-on: ubuntu-latest
    env:
      PR_BASE_REF: ${{ github.base_ref }}
      PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
    steps:
      - name: Checkout validation script
        uses: actions/checkout@v4
      - name: Validate state and backport labels
        run: |
          labels=()
          while IFS= read -r label; do
            labels+=("$label")
          done < <(jq -r '.[]' <<< "$PR_LABELS")
          scripts/validate-pr-state-labels.sh "${labels[@]}"
